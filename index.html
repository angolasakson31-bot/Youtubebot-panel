function b64Kodla(metin) {
  const bayt = new TextEncoder().encode(metin); let s = "";
  for (let i = 0; i < bayt.length; i += 0x8000) s += String.fromCharCode.apply(null, bayt.subarray(i, i + 0x8000));
  return btoa(s);
}
async function gh(yol, ayar = {}) {
  let r;
  for (let deneme = 0; ; deneme++) {   // telefon ağı / VPN kısa kopmalarında 3 kez dene
    try {
      r = await fetch(yol.startsWith("http") ? yol : "https://api.github.com" + yol, {
        ...ayar,
        headers: {Authorization: "Bearer " + TOKEN, Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", ...(ayar.headers || {})},
      });
      break;
    } catch (e) {
      if (deneme >= 2) throw new Error("GitHub'a bağlanılamadı (internet ya da VPN). VPN'i kapatıp sayfayı yenile.");
      await new Promise(c => setTimeout(c, 1500 * (deneme + 1)));
    }
  }
  if (!r.ok && r.status !== 404) {
    let m = ""; try { m = (await r.json()).message; } catch (e) {}
    throw new Error(`GitHub ${r.status}: ${m}`);
  }
  return r;
}
async function dosyaOku(yol, varsayilan = null) {
  const r = await gh(`/repos/${DEPO}/contents/${yol}?ref=main&t=${Date.now()}`,
                     {headers: {Accept: "application/vnd.github.raw+json"}});
  if (r.status === 404) return varsayilan;
  const metin = await r.text();
  try { return JSON.parse(metin); } catch (e) { return metin; }
}
async function dosyaYaz(yol, icerik, mesaj) {
  const metin = typeof icerik === "string" ? icerik : JSON.stringify(icerik, null, 2);
  const mevcut = await gh(`/repos/${DEPO}/contents/${yol}?ref=main&t=${Date.now()}`);
  const sha = mevcut.status === 404 ? undefined : (await mevcut.json()).sha;
  await gh(`/repos/${DEPO}/contents/${yol}`, {method: "PUT",
    body: JSON.stringify({message: mesaj, content: b64Kodla(metin), sha, branch: "main"})});
}
// Tetik: bu dosya değişince ilgili GitHub Actions işi başlar (commit mesajında [tetik] olmalı)
// ─── Anahtar kasası: anahtar telefonda depodaki açık anahtarla (RSA-OAEP) şifrelenir, sadece SIFRE'yi bilen işler çözer
async function kasaDurumu() {
  const r = await gh(`/repos/${DEPO}/contents/kasa?ref=main&t=${Date.now()}`);
  if (r.status === 404) return {kurulu: false, adlar: [], dosyalar: []};
  const l = await r.json();
  const adlar = l.map(x => x.name);
  return {kurulu: adlar.includes("acik_anahtar.pem"), dosyalar: l,
          adlar: adlar.filter(n => n.endsWith(".enc") && n !== "gizli_anahtar.enc").map(n => n.slice(0, -4))};
}
async function kasayaYaz(ad, deger) {
  const pem = await dosyaOku("kasa/acik_anahtar.pem", null);
  if (!pem || typeof pem !== "string") throw new Error("Kasa kurulu değil: İşler → 🔑 Anahtar testi'ni bir kez çalıştır.");
  const der = Uint8Array.from(atob(pem.replace(/-----[^-]+-----/g, "").replace(/\s+/g, "")), c => c.charCodeAt(0));
  const k = await crypto.subtle.importKey("spki", der, {name: "RSA-OAEP", hash: "SHA-256"}, false, ["encrypt"]);
  const sif = new Uint8Array(await crypto.subtle.encrypt({name: "RSA-OAEP"}, k, new TextEncoder().encode(deger.trim())));
  let b = ""; sif.forEach(x => b += String.fromCharCode(x));
  await dosyaYaz(`kasa/${ad}.enc`, btoa(b), `Panel: ${ad} anahtar kasasına eklendi (şifreli)`);
}
async function kasadanSil(ad) {
  const r = await gh(`/repos/${DEPO}/contents/kasa/${ad}.enc?ref=main&t=${Date.now()}`);
  if (r.status === 404) return;
  const {sha} = await r.json();
  await gh(`/repos/${DEPO}/contents/kasa/${ad}.enc`, {method: "DELETE",
    body: JSON.stringify({message: `Panel: ${ad} anahtar kasasından kaldırıldı`, sha, branch: "main"})});
}

// Panel istekleri kuyruğa EKLENİR (üzerine yazılmaz) → GitHub bir işi iptal etse bile istek kaybolmaz
async function kuyrugaEkle(dosya, veri, aciklama) {
  const mevcut = await dosyaOku(`tetik/${dosya}`, {});
  const islenen = await dosyaOku("tetik/islenen.json", {});
  const tur = dosya.replace(".json", "");
  const biten = new Set(((islenen || {})[tur] || []).map(String));
  const sinir = Date.now() - 14 * 864e5;
  let liste = (mevcut && Array.isArray(mevcut.istekler)) ? mevcut.istekler : [];
  liste = liste.filter(i => !biten.has(String(i.no)) || new Date(i.zaman || 0).getTime() > sinir);
  liste.push({...veri, no: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), zaman: new Date().toISOString()});
  await dosyaYaz(`tetik/${dosya}`, {istekler: liste.slice(-100), not: "Panel istek kuyruğu. İşlenenler tetik/islenen.json'da."},
                 `[tetik] Panel: ${aciklama}`);
}
async function bekleyenIstekler() {
  try {
    const [o, y, i] = await Promise.all([dosyaOku("tetik/onay.json", {}), dosyaOku("tetik/yeniden.json", {}), dosyaOku("tetik/islenen.json", {})]);
    const biten = t => new Set((((i || {})[t]) || []).map(String));
    const bo = biten("onay"), by = biten("yeniden");
    return [...((o && o.istekler) || []).filter(x => !bo.has(String(x.no))),
            ...((y && y.istekler) || []).filter(x => !by.has(String(x.no))).map(x => ({...x, yeniden: true}))];
  } catch (e) { return []; }
}

async function tetikle(dosya, veri, aciklama) {
  await dosyaYaz(`tetik/${dosya}`, {...veri, zaman: new Date().toISOString(), kaynak: "panel"},
                 `[tetik] Panel: ${aciklama}`);
}

async function releaseAl(etiket) {
  if (RELEASES[etiket] !== undefined) return RELEASES[etiket];
  const r = await gh(`/repos/${DEPO}/releases/tags/${etiket}`);
  RELEASES[etiket] = r.status === 404 ? null : await r.json();
  return RELEASES[etiket];
}
async function assetBul(v, ad) {
  if (!v.release) return null;
  const rel = await releaseAl(v.release);
  return rel ? {rel, asset: (rel.assets || []).find(a => a.name === (ad || v.id + ".mp4"))} : null;
}

function yayinZamani(v) { return new Date(String(v.yayinlanma).replace(" ", "T") + ":00+03:00"); }
function zamanYazi(v) {

let AYAR_VID = {};
const vAyar = k => (AYAR_VID && AYAR_VID[k] !== undefined) ? AYAR_VID[k] : VARSAYILAN_AYARLAR[k];
const KONU_ONCEDEN_SAAT = 26 + 24;      // ayarlar.py: URETIM_PENCERE_SAAT + 24 × KONU_ONCEDEN_GUN
const URETIM_PENCERE = 26;
const trSaat = d => new Date(d.getTime() + 3 * 3600e3);            // Türkiye saati (UTC+3) görünümü
function trTarih(gunEk, saat) {                                     // Türkiye'de bugün+gunEk günü, "HH:MM" → Date
  const t = trSaat(new Date()); const [h, m] = saat.split(":").map(Number);
  return new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate() + gunEk, h - 3, m));
}
function zamanKisa(d) {
  const t = trSaat(d), bugun = trSaat(new Date());
  const gunFark = Math.round((Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()) -
    Date.UTC(bugun.getUTCFullYear(), bugun.getUTCMonth(), bugun.getUTCDate())) / 864e5);
  const gun = gunFark === 0 ? "bugün" : gunFark === 1 ? "yarın" : gunFark === -1 ? "dün" : `${t.getUTCDate()} ${AY_ADLARI[t.getUTCMonth()]}`;
  return `${gun} ${String(t.getUTCHours()).padStart(2, "0")}:${String(t.getUTCMinutes()).padStart(2, "0")}`;
}
// Günlük işler 07:17 ve 10:17 (yedek) çalışır: yayına ≤ saat kalan ilk çalışma zamanı
function ilkCalisma(yayin, saat, saatler = ["07:17", "10:17"]) {
  for (let g = 0; g < 10; g++) for (const s of saatler) {
    const t = trTarih(g, s);
    if (t > new Date() && (yayin - t) / 3600e3 <= saat) return t;
  }
  return null;
}
function siradakiSatirlar() {
  const simdi = new Date(), sinir = new Date(simdi.getTime() + 3 * 864e5);
  const satirlar = PLAN.filter(v => v.durum !== "reddedildi" && !(v.durum === "yuklendi" && yayinZamani(v) <= simdi)
      && yayinZamani(v) <= sinir && !(v.hemen && v.durum === "yuklendi"))
    .map(v => ({v, zaman: yayinZamani(v)}));
  if (vAyar("URETIM_RITMI") === "gunluk") {
    for (let g = 0; g < 4; g++) for (const s of vAyar("YAYINLANMA_SAATLERI") || []) {
      const z = trTarih(g, s);
      if (z <= new Date(simdi.getTime() + 2 * 3600e3) || z > sinir) continue;
      if (satirlar.some(x => Math.abs(x.zaman - z) <= 90 * 60e3)) continue;
      satirlar.push({bos: true, zaman: z});
    }
  }
  return satirlar.sort((a, b) => a.zaman - b.zaman);
}
function siradakiAlan() {
  const satirlar = siradakiSatirlar();
  const gunluk = vAyar("URETIM_RITMI") === "gunluk", mod = vAyar("ONAY_MODU"), once = +vAyar("YUKLEME_ONCEDEN_SAAT");
  const bekleyenKonu = id => BEKLEYEN.find(i => (i.duzenle || []).some(d => d.id === id && d.konu));
  const satir = x => {
    const v = x.v, z = x.zaman;
    let konu, uretim, yukleme, dugme = "";
    if (x.bos) {

      uretim = `${zamanKisa(ilkCalisma(z, URETIM_PENCERE) || z)}`;
      yukleme = "üretimden hemen sonra";

      const hk = v.tur === "hikaye" ? [v.seri || v.seri_secim ? "📺 " + (v.seri || v.seri_secim) : "",

      konu = `<b>${v.gorunum === "animasyon" ? "🎬 " : ""}${esc(v.baslik || v.konu)}</b>${v.baslik && v.baslik !== v.konu ? `<div class="ince">Konu: ${esc(v.konu)}</div>` : ""}`

      if (v.durum === "bekliyor") {

          dugme = `<button data-git="${esc(v.id)}">▶️ İzle</button><button data-id="${esc(v.id)}" data-islem="duzenle">🔁 Değiştirip yeniden üret</button>`;

    <p class="ince" style="margin:4px 0 0">Konu ${hikayeKanali() ? "(hikâye, kalıp, ton, kapanış, seri) " : ""}yayından 1 gün önce seçilir → üretilmeden önce ✏️ ile her şeyini değiştirebilirsin.

// ayarlar.py SERILER ile aynı adlar

const hikayeKanali = () => vAyar("KANAL_TURU") === "hikaye";
const SERI_ADLARI_AL = () => hikayeKanali() ? SERI_HIKAYE : SERI_BILIM;
const TON_ADLARI = {huzunlu: "😢 Hüzünlü", bilge: "🦉 Bilge / sakin", gerilimli: "⚡ Gerilimli", komik: "😄 Tatlı mizahlı", umut: "🌅 Umut veren"};
const KAPANIS_ADLARI = {hikmet: "Tek cümle hikmet", izleyiciye: "İzleyiciye dön (\"Sen de…\")", soru: "Düşündüren soru",
  ters_kose: "Ters köşe son", sessiz: "Sessiz bitiş", atasozu: "Atasözü / vecize"};
// 📖 Anlatım biçimi grupları: [ayar adı, açık listesi, ad sözlüğü, başlık]
const BICIMLER = {kalip: ["HIKAYE_KALIPLARI", "HIKAYE_KALIP_ACIK", () => KALIP_ADLARI, "🧩 Anlatım kalıbı"],
  ton: ["HIKAYE_TONLARI", "HIKAYE_TON_ACIK", () => TON_ADLARI, "🎭 Ton"],
  kapanis: ["HIKAYE_KAPANISLARI", "HIKAYE_KAPANIS_ACIK", () => KAPANIS_ADLARI, "🎬 Kapanış (ders nasıl verilsin)"]};
const bicimAdi = (tur, k) => (BICIMLER[tur][2]()[k]) || k;
const KALIP_ADLARI = {celiski: "çelişki → geçmiş → ders", sondan: "sondan başla", iki_kez: "iki karşılaşma",
  soru: "soru → hikâye → cevap", sinav: "sınav / imtihan", uc_kez: "üç kez tekrar eden hata", ters_kose: "ters köşe"};
// 📖 Hikâye kanalında video başına anlatım kalıbı (boş = sistem hikâyeye göre seçer)
const bicimSecim = (tur, id, deger) => {
  const [ayar, acikAd, , baslik] = BICIMLER[tur];
  const acik = vAyar(acikAd) || [];
  const kodlar = Object.keys(vAyar(ayar) || {}).filter(k => !acik.length || acik.includes(k) || k === deger);
  return `<div><label>${baslik}</label><select id="${id}"><option value="">Otomatik (sistem seçer)</option>
  ${kodlar.map(k => `<option value="${esc(k)}" ${deger === k ? "selected" : ""}>${esc(bicimAdi(tur, k))}</option>`).join("")}</select></div>`;
};
const kalipSecim = (id, deger, v) => !hikayeKanali() ? "" : `<div>${bicimSecim("kalip", id, deger)}
  ${bicimSecim("ton", id + "Ton", v && v.ton)}${bicimSecim("kapanis", id + "Kap", v && v.kapanis)}</div>`;
const kalipDeger = id => $("#" + id) ? $("#" + id).value : undefined;
const bicimDegerleri = id => $("#" + id) ? {kalip: $("#" + id).value, ton: $("#" + id + "Ton").value, kapanis: $("#" + id + "Kap").value} : {};
// 📖 Bu videoya özel masalcı ses + çizim stili (boşsa Ayarlar'daki genel değer)
const hikayeOzelAlan = (p, v) => !hikayeKanali() ? "" : `<details ${v && (v.ses_id || v.cizim_stili) ? "open" : ""}><summary class="alt">🎙️ Ses ve 🪟 çizim stili (sadece bu video)</summary>
  <label>Masalcı ses kimliği (Voice ID) <span class="ince">(boşsa Ayarlar'daki ses)</span></label>
  <input id="${p}SesId" placeholder="${esc(vAyar("HIKAYE_SES_ID") || "DpEiQMnL9WxMsymCsjPY")}" value="${esc((v && v.ses_id) || "")}">
  <label>Çizim stili <span class="ince">(boşsa Ayarlar'daki stil; Türkçe yaz)</span></label>
  <textarea id="${p}CizimStili" style="min-height:60px" placeholder="ör. Osmanlı minyatürü gibi, altın varaklı">${esc((v && v.cizim_stili) || "")}</textarea></details>`;
const hikayeOzelDeger = p => $("#" + p + "SesId") ? {ses_id: $("#" + p + "SesId").value.trim(), cizim_stili: $("#" + p + "CizimStili").value.trim()} : {};
const gunlukSureAl = () => hikayeKanali() ? (vAyar("HIKAYE_SURE") || 45) : (vAyar("GUNLUK_SURE") || 30);
// 🔁 Kanal profili değiştir: şu anki ayarlar kanal_profilleri/<tür>.json'a saklanır, hedef kanalın saklı ayarları geri gelir.
// Bağlantı / maliyet ayarları iki kanalda ortak kalır.
const ORTAK_AYARLAR = ["CLOUDFLARE_HESAP", "CLOUDFLARE_HESAP_2", "CLOUDFLARE_AKTIF", "EK_SAGLAYICILAR", "GOREV_MODELLERI", "MALIYET_SIFIR", "AYLIK_BUTCE", "BUTCE_DAVRANIS",
  "IZIN_SURESIZ", "ONERI_KARARLARI", "MALIYET_PROFILI", "URETIM_DURAKLAT"];
async function kanalDegistir(hedef) {
  const simdiki = await dosyaOku("ayarlar.json", {});
  const cur = (simdiki && simdiki.KANAL_TURU) || "bilim";
  if (cur === hedef) return;
  const saklanan = await dosyaOku(`kanal_profilleri/${hedef}.json`, null);
  await dosyaYaz(`kanal_profilleri/${cur}.json`, simdiki, `Panel: ${cur} kanalının ayarları saklandı`);
  const yeni = {...(saklanan && typeof saklanan === "object" ? saklanan : simdiki)};
  for (const k of ORTAK_AYARLAR) { if (k in simdiki) yeni[k] = simdiki[k]; else delete yeni[k]; }
  if (!saklanan && hedef === "hikaye") Object.assign(yeni, {YAYINLANMA_SAATLERI: ["20:00"], KONU_NOTU: "", SENARYO_NOTU: "", OZEL_KONULAR: []});
  yeni.KANAL_TURU = hedef;
  await dosyaYaz("ayarlar.json", yeni, `Panel: kanal türü → ${hedef}`);
}
// ✏️ Bir yayın saatinin bütün ayarları: üretilmemiş videoyu düzenler ya da boş saate yeni video planlar
function konuModal(id, zamanIso) {
  const v = id ? PLAN.find(x => x.id === id) : null;
  if (v && v.durum !== "bekliyor") return bilgiModal(v);
  const z = v ? yayinZamani(v) : new Date(zamanIso);
  const zamanDegeri = trSaat(z).toISOString().slice(0, 16);
  const kendi = v && v.dogrulama === "elle yazıldı" ? (v.cumleler || []).join("\n") : "";
  modalAc(`<h3>✏️ ${v ? "Videoyu düzenle" : "Bu saate video planla"}</h3>
    <p class="alt">📺 ${zamanKisa(z)} yayını · henüz üretilmedi, hepsini değiştirebilirsin</p>
    <label>Konu (ne anlatsın? ne kadar ayrıntı verirsen o kadar iyi)</label>
    <textarea id="kKonu" style="min-height:80px">${v ? esc(v.konu) : ""}</textarea>
    <div class="satir"><div><label>Video süresi</label><select id="kSure">${sureSecenek(v ? (v.hedef_sure || gunlukSureAl()) : gunlukSureAl())}</select></div>
      <div><label>Yayın tarihi ve saati</label><input type="datetime-local" id="kZaman" value="${zamanDegeri}"></div></div>
    ${gorunumSecim("kGorunum", v && v.gorunum)}${kalipSecim("kKalip", v && v.kalip, v)}${hikayeOzelAlan("k", v)}
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="kOnceIzle" style="width:auto" ${v && v.onay_bekle ? "checked" : ""}>
      👀 Yayınlamadan önce ben izleyeyim <span class="ince">(hazır olunca bekler, ✅ Onayla deyince yayınlanır)</span></label>
    <label>📺 Seri</label>
    <select id="kSeri"><option value="">Otomatik (yapay zekâ konuya göre seçer)</option>
      ${SERI_ADLARI_AL().map(s => `<option ${v && v.seri_secim === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
    <label>📝 Bu videoya özel talimat <span class="ince">(isteğe bağlı)</span></label>
    <textarea id="kNot" style="min-height:60px" placeholder="ör. Çocuğa anlatır gibi anlat · Biraz mizahi olsun · Sonunda Türkiye'den bir örnek ver">${esc((v && v.video_notu) || "")}</textarea>
    <details ${(v && v.baslik) || kendi ? "open" : ""}><summary class="alt">İsteğe bağlı: kendi başlığın / kendi senaryon</summary>
      <label>YouTube başlığı (boşsa yapay zekâ yazar)</label><input id="kBaslik" maxlength="95" value="${esc((v && v.baslik) || "")}">
      <label>Kendi senaryon (her satır bir cümle = bir sahne; boşsa yapay zekâ yazar)</label>
      <textarea id="kSenaryo" style="min-height:110px">${esc(kendi)}</textarea></details>
    <p class="ince" id="kNotBilgi"></p>
    <div class="butonlar"><button onclick="modalKapat()">Vazgeç</button><button class="ana" id="kGonder">💾 Kaydet</button></div>`);
  const yakinMi = () => { const t = new Date($("#kZaman").value + ":00+03:00"); return (t - new Date()) / 3600e3 <= URETIM_PENCERE; };
  const bilgiYaz = () => $("#kNotBilgi").textContent = yakinMi() && !v
    ? "Bu yayına 1 günden az kaldığı için video hemen üretilecek." : "Video yayın günü sabahı bu ayarlarla üretilir.";
  $("#kZaman").onchange = bilgiYaz; bilgiYaz();
  $("#kGonder").onclick = async () => {
    const konu = $("#kKonu").value.trim();
    if (konu.length < 5) return bildir("Konuyu biraz daha açık yaz.");
    const zSecilen = $("#kZaman").value;
    if (!zSecilen) return bildir("Yayın saatini seç.");
    if (new Date(zSecilen + ":00+03:00") < new Date(Date.now() + 20 * 60e3)) return bildir("En az 20 dk sonrası bir saat seç.", 5000);
    const zaman = zSecilen.replace("T", " ");
    if (zaman !== zamanDegeri.replace("T", " ") && PLAN.some(x => x.yayinlanma === zaman && x.durum !== "reddedildi" && (!v || x.id !== v.id)))
      if (!confirm("Bu saatte zaten bir video var. Yine de bu saate koyayım mı?")) return;
    const ortak = {konu, sure: +$("#kSure").value, gorunum: gorunumDeger("kGorunum"), once_izle: $("#kOnceIzle").checked,
                   seri_secim: $("#kSeri").value, ...bicimDegerleri("kKalip"), ...hikayeOzelDeger("k"), video_notu: $("#kNot").value.trim(), baslik: $("#kBaslik").value.trim(),
                   cumleler: $("#kSenaryo").value.split("\n").map(x => x.trim()).filter(Boolean)};
    $("#kGonder").disabled = true;
    try {
      if (v) {
        if (v.durum !== "bekliyor") throw new Error("Bu video üretildi; artık değiştirilemez.");
        const istek = {id: v.id, ...ortak};
        if (zaman !== zamanDegeri.replace("T", " ")) istek.yayinlanma = zaman;
        await kuyrugaEkle("onay.json", {duzenle: [istek]}, `video düzenle ${v.id}`);
      } else if (yakinMi()) {
        await kuyrugaEkle("yeniden.json", {mod: "yeni", ...ortak, yayinlanma: zaman}, `yeni video: ${konu.slice(0, 40)}`);
      } else {
        await kuyrugaEkle("onay.json", {planla: [{...ortak, yayinlanma: zaman}]}, `video planla ${zaman}`);
      }
      modalKapat(); bildir("✅ Kaydedildi. Birkaç dakika içinde listede görünür (↻ ile yenile).", 5000); videolar();
    } catch (e) { bildir("❌ " + e.message, 6000); $("#kGonder").disabled = false; }
  };
}

async function videolar() {
  $("#ana").innerHTML = `<p class="alt">Yükleniyor…</p>`;
  let maliyet;
  [PLAN, BEKLEYEN, YORUMLAR, maliyet, AYAR_VID] = await Promise.all([dosyaOku("haftalik_plan.json", []), bekleyenIstekler(),
    dosyaOku("yorumlar.json", {}), dosyaOku("maliyet.json", []), dosyaOku("ayarlar.json", {})]);
  VIDEO_MALIYET = {};
  for (const k of (Array.isArray(maliyet) ? maliyet : [])) {
    if (!k.video) continue;
    const m = VIDEO_MALIYET[k.video] = VIDEO_MALIYET[k.video] || {usd: 0, kredi: 0, giris: 0, cikis: 0, arama: 0, isler: {}};
    m.usd += k.usd || 0; m.kredi += k.kredi || 0; m.giris += k.giris || 0; m.cikis += k.cikis || 0; m.arama += k.arama || 0;
    if (k.usd) m.isler[k.is] = (m.isler[k.is] || 0) + k.usd;
  }
  if (!PLAN.length) { $("#ana").innerHTML = `<div class="kart">Henüz video yok.</div>`; return; }
  const say = g => PLAN.filter(v => videoGrubu(v) === g).length;
  let html = `<div class="kart"><div class="satir" style="text-align:center">
      <div><b style="font-size:22px">${say("yayinda")}</b><div class="alt">✅ yayında</div></div>
      <div><b style="font-size:22px">${say("zamanli")}</b><div class="alt">⏰ YouTube'da bekliyor</div></div>
      <div><b style="font-size:22px">${say("sirada") + say("onay")}</b><div class="alt">📤 yüklenecek</div></div>
      <div><b style="font-size:22px">${say("uretim")}</b><div class="alt">🎬 üretilecek</div></div></div>
    <details style="margin-top:8px"><summary class="alt">ℹ️ Bir video nasıl yayınlanır?</summary><ol class="alt">
      <li><b>Her sabah 07:17</b>: o günün konuları seçilir (güncel haberler + kanalın öğrendikleri) → senaryo → ses → video; panelde <b>▶️ İzle</b> ile görünür.</li>
      <li>Onay modu "otomatik" ise hemen onaylanır ve YouTube'a <b>gizli + zamanlanmış</b> olarak yüklenir (kota dolarsa ertesi gün 11:07).</li>
      <li>Yayın saati gelince YouTube videoyu <b>kendiliğinden herkese açar</b>. O ana kadar başlığını, saatini değiştirebilir, silebilir ya da hemen yayınlayabilirsin.</li>
      <li>YouTube'a gitmeden önce bakmak istersen Ayarlar → Onay modu → "Pazar" ya da "Elle".</li></ol></details></div>
    <nav class="filtre" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px">
      ${[["sirada", "⏭️ Sıradakiler"], ["yayinda", "✅ Yayınlananlar"], ["hepsi", "🗂️ Haftalara göre"]].map(([k, ad]) =>
        `<button data-filtre="${k}" class="${VIDEO_FILTRE === k ? "aktif ana" : ""}">${ad}</button>`).join("")}
      <button id="yenile">↻</button><button id="uretBaslat">▶️ Üretimi başlat</button>
      <button id="yeniVideo" class="ana">⚡ Yeni video yaptır</button></nav>`;
  html += siradakiAlan();
  const yeniBekleyen = BEKLEYEN.filter(i => i.mod === "yeni");
  if (yeniBekleyen.length) html += `<div class="kart"><b>⚡ Hazırlanan yeni videoların</b>${yeniBekleyen.map(i =>
    `<div class="alt">⏳ ${esc(i.konu)} — ${i.yayinlanma ? esc(i.yayinlanma.replace("T", " ")) : "hazır olunca hemen"}</div>`).join("")}
    <p class="ince">Üretim ~5-10 dk sürer, sonra burada kart olarak görünür (↻ ile yenile).</p></div>`;
  if (VIDEO_FILTRE === "hepsi") {
    const haftalar = [...new Set(PLAN.map(v => v.hafta))].sort().reverse();
    for (const h of haftalar) {
      const vs = PLAN.filter(v => v.hafta === h).sort((a, b) => a.yayinlanma.localeCompare(b.yayinlanma));
      const bekleyen = vs.filter(v => v.durum === "video_hazir").length;
      html += `<h2 style="font-size:16px;margin:18px 0 8px">📅 ${esc(h)} haftası <span class="alt">(${vs.length} video)</span></h2>`;
      if (bekleyen) html += `<div class="butonlar" style="margin:0 0 10px"><button data-hepsi="${esc(h)}">✅ Bu haftanın ${bekleyen} videosunu onayla</button></div>`;
      vs.forEach(v => html += videoKarti(v));
    }
  } else {
    const liste = VIDEO_FILTRE === "yayinda"
      ? PLAN.filter(v => videoGrubu(v) === "yayinda").sort((a, b) => b.yayinlanma.localeCompare(a.yayinlanma))
      : PLAN.filter(v => !["yayinda", "red"].includes(videoGrubu(v))).sort((a, b) => a.yayinlanma.localeCompare(b.yayinlanma));
    if (!liste.length) html += `<div class="kart alt">Burada video yok.</div>`;
    let gun = "";
    for (const v of liste) {
      if (v.tarih !== gun) { gun = v.tarih; html += `<h2 style="font-size:15px;margin:16px 0 6px">${esc(v.gun)} · ${esc(v.tarih)}</h2>`; }
      html += videoKarti(v);
    }
  }
  $("#ana").innerHTML = html;
  document.querySelectorAll("[data-filtre]").forEach(b => b.onclick = () => {
    VIDEO_FILTRE = b.dataset.filtre; try { localStorage.setItem("ytb_filtre", VIDEO_FILTRE); } catch (e) {} videolar();
  });
  $("#yenile").onclick = () => { RELEASES = {}; videolar(); };
  $("#yeniVideo").onclick = yeniVideoModal;
  $("#uretBaslat").onclick = async () => {
    if (!confirm("Bekleyen konular için üretim başlatılsın mı? (Yeni hafta yoksa sadece bekleyenler üretilir.)")) return;
    try { await tetikle("uretim.json", {test: false}, "üretimi başlat"); bildir("▶️ Üretim başlatıldı. 'İşler' sekmesinden izleyebilirsin."); }
    catch (e) { bildir("❌ " + e.message, 6000); }
  };
  document.querySelectorAll("[data-hepsi]").forEach(b => b.onclick = () => {
    PLAN.filter(v => v.hafta === b.dataset.hepsi && v.durum === "video_hazir").forEach(v => KARARLAR[v.id] = "onay");
    kararCubugu(); videolar();
  });
  document.querySelectorAll("[data-islem]").forEach(b => b.onclick = () => videoIslem(b.dataset.islem, b.dataset.id, b));
  document.querySelectorAll("[data-konu-degis]").forEach(b => b.onclick = () => konuModal(b.dataset.konuDegis, b.dataset.zaman));
  document.querySelectorAll("[data-git]").forEach(b => b.onclick = () => {      // 📋 → videonun kartına git (izle düğmesi orada)
    const k = document.getElementById("k_" + b.dataset.git);
    if (k) { k.scrollIntoView({behavior: "smooth", block: "center"}); k.style.outline = "2px solid var(--vurgu, #e8b23a)"; setTimeout(() => k.style.outline = "", 2500); }
    else bildir("Kartı görmek için Videolar → Sıradakiler filtresini seç.");
  });
  kararCubugu();
  denemeDugmeleri();
}

// Görsel karşılaştırma videoları (<id>_deneme_<etiket>.mp4) varsa kartına "🆚 izle" düğmesi
async function denemeDugmeleri() {
  const etiketler = [...new Set(PLAN.filter(v => v.release && document.getElementById("deneme_" + v.id)).map(v => v.release))];
  for (const et of etiketler) {
    let rel; try { rel = await releaseAl(et); } catch (e) { continue; }
    for (const a of (rel && rel.assets) || []) {
      const m = a.name.match(/^(.+)_deneme_(.+)\.mp4$/);
      const kutu = m && document.getElementById("deneme_" + m[1]);
      if (!kutu || kutu.querySelector(`[data-ad="${CSS.escape(a.name)}"]`)) continue;
      const btn = document.createElement("button");
      btn.dataset.ad = a.name; btn.textContent = `🆚 Karşılaştırma: ${m[2]}`;
      btn.onclick = async () => {
        const eski = btn.textContent; btn.disabled = true; btn.textContent = "⏳";
        try {
          const v = PLAN.find(x => x.id === m[1]);
          const url = URL.createObjectURL(await videoBlob(v, a.name));
          $("#oynat_" + m[1]).innerHTML = `<div class="ince">🆚 ${esc(m[2])} sürümü (sadece deneme, yayınlanmadı)</div><video src="${url}" controls autoplay playsinline></video>`;
        } catch (e) { bildir("❌ " + e.message, 5000); }
        btn.disabled = false; btn.textContent = eski;
      };
      kutu.appendChild(btn);
    }
  }
}

function videoKarti(v) {
  const grup = videoGrubu(v);
  const [durumYazi, durumSinif] = GRUP[grup];
  const karar = KARARLAR[v.id];
  const id = esc(v.id);
  let b = "";
  if (v.durum === "video_hazir") b += `
    <button data-islem="onay" data-id="${id}" class="${karar === "onay" ? "sec-onay" : ""}">✅ Onayla</button>
    <button data-islem="red" data-id="${id}" class="${karar === "red" ? "sec-red" : ""}">❌ Reddet</button>`;
  if (v.kalite_dosya && (v.kalite_hatasi || []).length) b += `<button data-islem="hataliIzle" data-id="${id}">▶️ Hatalı hâlini izle</button>`;
  if (v.release && !["bekliyor", "seslendirildi"].includes(v.durum)) b += `<button data-islem="izle" data-id="${id}">▶️ İzle</button>
    <button data-islem="indir" data-id="${id}">⬇️ İndir</button>`;
  if (v.youtube_id) b += `<a class="btn" target="_blank" href="https://youtube.com/shorts/${esc(v.youtube_id)}">📺 YouTube</a>`;
  if (grup !== "red") b += `<button data-islem="bilgi" data-id="${id}">✏️ Başlık / saat${v.durum === "bekliyor" ? " / konu" : ""}</button>`;
  if (["onay", "sirada", "zamanli"].includes(grup) && !v.hemen)
    b += `<button data-islem="hemen" data-id="${id}">🚀 Hemen yayınla</button>`;
  if (grup === "zamanli") b += `<button data-islem="sil" data-id="${id}">🗑️ YouTube'dan sil</button>`;
  if (!["yuklendi", "bekliyor"].includes(v.durum) && (v.durum !== "seslendirildi" || (v.kalite_hatasi || []).length)) b += `
    <button data-islem="duzenle" data-id="${id}">🔁 Senaryo / yeniden üret</button>
    <button data-islem="kendi" data-id="${id}">📤 Kendi videomu yükle</button>`;
  const cumleler = (v.cumleler || []).map(c => `<p>${esc(c)}</p>`).join("");
  const duzeltme = (v.dogrulama_duzeltmeleri || []).length;
  return `<div class="kart" id="k_${id}">

$("#kararGonder").onclick = async () => {

  try {

    const taze = await dosyaOku("haftalik_plan.json", []);

      return bildir("Bu videolar artık onay beklemiyor (durumları değişmiş). Liste yenileniyor.", 5000), videolar(); }

async function videoBlob(v, ad) {
  const b = await assetBul(v, ad);
  if (!b || !b.asset) throw new Error("Video dosyası bulunamadı.");
  const r = await fetch(b.asset.url, {headers: {Authorization: "Bearer " + TOKEN, Accept: "application/octet-stream"}});
  if (!r.ok) throw new Error("İndirilemedi (" + r.status + ")");
  return await r.blob();
}
function githubLinki(v) { return `https://github.com/${DEPO}/releases/download/${v.release}/${v.id}.mp4`; }

async function videoIslem(islem, id, buton) {
  const v = PLAN.find(x => x.id === id);
  if (islem === "onay" || islem === "red") {
    KARARLAR[id] = KARARLAR[id] === islem ? undefined : islem;
    if (!KARARLAR[id]) delete KARARLAR[id];
    document.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-islem="onay"], [data-id="${CSS.escape(id)}"][data-islem="red"]`).forEach(b =>
      b.className = KARARLAR[id] === b.dataset.islem ? (b.dataset.islem === "onay" ? "sec-onay" : "sec-red") : "");
    kararCubugu(); return;
  }
  if (islem === "izle" || islem === "indir" || islem === "hataliIzle") {
    const eski = buton.textContent; buton.disabled = true; buton.textContent = "⏳";
    try {
      const blob = await videoBlob(v, islem === "hataliIzle" ? v.kalite_dosya : null); const url = URL.createObjectURL(blob);
      if (islem === "hataliIzle") { $("#oynat_" + id).innerHTML = `<video src="${url}" controls autoplay playsinline></video>`; buton.disabled = false; buton.textContent = eski; return; }
      if (islem === "izle") $("#oynat_" + id).innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
      else { const a = document.createElement("a"); a.href = url; a.download = id + ".mp4"; a.click(); }
    } catch (e) {
      // Tarayıcı doğrudan indirmeye izin vermezse GitHub'da aç (GitHub'a giriş yapmış olman gerekir)
      bildir("Panelden açılamadı, GitHub'da açılıyor…"); window.open(githubLinki(v), "_blank");
    }
    buton.disabled = false; buton.textContent = eski; return;
  }
  if (islem === "hemen" || islem === "sil") {
    const soru = islem === "hemen"
      ? "Bu video yayın saatini beklemeden HEMEN yayınlansın mı?"
      : "Bu video YouTube'dan silinsin mi? (Henüz yayınlanmadı; geri alınamaz.)";
    if (!confirm(soru)) return;
    buton.disabled = true;
    try {
      await kuyrugaEkle("onay.json", islem === "hemen" ? {hemen: id} : {reddet: id},
                    islem === "hemen" ? `hemen yayınla ${id}` : `YouTube'dan sil ${id}`);
      bildir(islem === "hemen" ? "🚀 Gönderildi. 2-3 dakika içinde yayında." : "🗑️ Gönderildi. 2-3 dakika içinde silinir.", 5000);
    } catch (e) { bildir("❌ " + e.message, 6000); }
    buton.disabled = false; return;
  }
  if (islem === "duzenle") return duzenleModal(v);
  if (islem === "bilgi") return v.durum === "bekliyor" ? konuModal(v.id) : bilgiModal(v);
  if (islem === "kendi") return kendiVideom(v);
}

      return bildir("Görsel kelime sayısı cümle sayısıyla aynı olmalı (ya da görsel kutusunu boş bırak).", 5000);
    $("#dGonder").disabled = true;
    try { await kuyrugaEkle("yeniden.json", veri, `yeniden üret ${v.id}`); modalKapat();
          bildir("🔁 Yeniden üretim başladı. 3-5 dakika sonra 'Yenile'.", 5000); }
    catch (e) { bildir("❌ " + e.message, 6000); $("#dGonder").disabled = false; }
  };
}

function kendiVideom(v) {
  modalAc(`
    <h3>📤 Kendi videonu yükle</h3>
    <p class="alt">Önce <b>⬇️ İndir</b> ile videoyu al, CapCut gibi bir uygulamada düzenle, sonra buradan yükle.
      YouTube'a <b>senin sürümün</b> gider (bu video henüz yüklenmediyse).</p>
    <div class="uyari">Dikey (9:16) MP4 olmalı. Bu video daha sonra "yeniden üret" yapılırsa senin sürümün silinir.</div>
    <label>Video dosyası</label><input type="file" id="kDosya" accept="video/mp4,video/*">
    <div class="yukleme" id="kIlerleme" style="display:block"><i></i></div>
    <div class="butonlar"><button onclick="modalKapat()">Vazgeç</button><button class="ana" id="kGonder">Yükle</button></div>`);
  $("#kGonder").onclick = async () => {
    const dosya = $("#kDosya").files[0];
    if (!dosya) return bildir("Önce bir video seç.");
    $("#kGonder").disabled = true;
    try {
      const b = await assetBul(v);
      if (!b) throw new Error("Bu haftanın Release'i bulunamadı.");
      const geciciAd = `${v.id}.yeni-${Date.now()}.mp4`;
      const yuklenen = await new Promise((tamam, hata) => {
        const x = new XMLHttpRequest();
        x.open("POST", `https://uploads.github.com/repos/${DEPO}/releases/${b.rel.id}/assets?name=${encodeURIComponent(geciciAd)}`);
        x.setRequestHeader("Authorization", "Bearer " + TOKEN);
        x.setRequestHeader("Content-Type", dosya.type || "video/mp4");
        x.upload.onprogress = e => { if (e.lengthComputable) $("#kIlerleme i").style.width = (100 * e.loaded / e.total) + "%"; };
        x.onload = () => x.status < 300 ? tamam(JSON.parse(x.responseText)) : hata(new Error("Yükleme hatası " + x.status + ": " + x.responseText.slice(0, 150)));
        x.onerror = () => hata(new Error("Ağ hatası (tarayıcı yüklemeyi engellemiş olabilir)."));
        x.send(dosya);
      });
      // Yükleme başarılı → eskisini sil, yenisini asıl adına çevir (yarıda kalırsa eski video kaybolmaz)
      if (b.asset) await gh(`/repos/${DEPO}/releases/assets/${b.asset.id}`, {method: "DELETE"});
      await gh(`/repos/${DEPO}/releases/assets/${yuklenen.id}`, {method: "PATCH", body: JSON.stringify({name: `${v.id}.mp4`})});
      delete RELEASES[v.release];
      modalKapat(); bildir("✅ Senin videon yüklendi. YouTube'a bu sürüm gidecek.", 5000);
    } catch (e) { bildir("❌ " + e.message, 7000); $("#kGonder").disabled = false; }
  };
}

  const saatCiz = liste => {
    $("#saatler").innerHTML = liste.map((s, i) => `<div class="satir" style="margin-bottom:6px">
      <input type="time" class="saat" value="${esc(s)}"><button data-sil="${i}" style="flex:0">✕</button></div>`).join("");
    document.querySelectorAll("[data-sil]").forEach(b => b.onclick = () => {

  saatCiz(a.YAYINLANMA_SAATLERI);
  const saglayiciCiz = liste => {
    $("#saglayicilar").innerHTML = [1, 2, 3].map(no => {
      const s = liste.find(x => +x.yuva === no) || {};

        <label>Hazır ayar</label><select class="sHazir">${Object.entries(HAZIR_SAGLAYICILAR).map(([k, [ad, url]]) =>
          `<option value="${k}" ${s.base_url && s.base_url === url ? "selected" : ""}>${ad}</option>`).join("")}</select>
        <label>Ad</label><input class="sAd" value="${esc(s.ad || "")}" placeholder="ör. DeepSeek (boş = yuva kullanılmıyor)">
        <label>API adresi (base URL)</label><input class="sUrl" value="${esc(s.base_url || "")}" placeholder="https://.../v1">
        <label>Kullanacağın model adları (virgülle)</label><input class="sModel" value="${esc((s.modeller || []).join(", "))}" placeholder="ör. deepseek-chat">
        ${((bulunan && bulunan.ek && bulunan.ek[no]) || []).length ? `<div class="ince">Bu sağlayıcıda bulunan modeller (dokun → ekle):<br>${
          bulunan.ek[no].slice(0, 60).map(m => `<button type="button" class="mEkle" data-m="${esc(m)}" style="font-size:11px;padding:2px 6px;margin:2px">${esc(m)}</button>`).join("")}</div>`
          : `<div class="ince">Anahtarı ekleyip kaydettikten sonra İşler → 🔑 Anahtar testi yaparsan bu sağlayıcıdaki modeller burada listelenir.</div>`}
        <div class="satir"><div><label>Fiyat: giriş $/1M token</label><input type="number" step="0.01" class="sFg" value="${esc((s.fiyat || [])[0] ?? "")}"></div>
          <div><label>Fiyat: çıkış $/1M token</label><input type="number" step="0.01" class="sFc" value="${esc((s.fiyat || [])[1] ?? "")}"></div></div></div>`;
    }).join("");
    document.querySelectorAll(".sHazir").forEach(sel => sel.onchange = () => {
      const k = sel.closest("[data-yuva]"), [ad, url] = HAZIR_SAGLAYICILAR[sel.value];
      if (url) { k.querySelector(".sUrl").value = url; if (!k.querySelector(".sAd").value) k.querySelector(".sAd").value = ad; }
      gorevCiz(saglayicilariOku());
    });
    document.querySelectorAll("#saglayicilar input").forEach(i => i.onchange = () => gorevCiz(saglayicilariOku()));
    document.querySelectorAll(".mEkle").forEach(b => b.onclick = () => {
      const g = b.closest("[data-yuva]").querySelector(".sModel");
      const l = g.value.split(",").map(x => x.trim()).filter(Boolean);
      if (!l.includes(b.dataset.m)) { l.push(b.dataset.m); g.value = l.join(", "); gorevCiz(saglayicilariOku()); }
    });
  };
  const saglayicilariOku = () => [...document.querySelectorAll("[data-yuva]")].map(k => ({
    yuva: +k.dataset.yuva, ad: k.querySelector(".sAd").value.trim(), base_url: k.querySelector(".sUrl").value.trim(),
    modeller: k.querySelector(".sModel").value.split(",").map(x => x.trim()).filter(Boolean),
    fiyat: [+k.querySelector(".sFg").value || 0, +k.querySelector(".sFc").value || 0],
  })).filter(s => s.ad && s.base_url && s.modeller.length);
  let gorevSecim = {...(a.GOREV_MODELLERI || {})};
  if (a.BILGI_DOGRULAMA === false && !gorevSecim.dogrulama) gorevSecim.dogrulama = "kapali";
  if (gorevSecim.guncel_konular === "kapali") delete gorevSecim.guncel_konular;   // artık İçerik → haber günleriyle yönetiliyor
  const gorevCiz = liste => {
    document.querySelectorAll("[data-gorev]").forEach(x => gorevSecim[x.dataset.gorev] = x.value);
    const ekler = liste.flatMap(s => s.modeller.map(m => [`ek${s.yuva}:${m}`, `${s.ad} · ${m}`]));
    const secenekler = [["", "Varsayılan (maliyet profili)"], ...claudeListe, ...ekler];
    // Ses / görsel listesi: elle yazılan modeller + sağlayıcıda bulunan, işe uygun adlı modeller (otomatik)
    const uygunlar = desen => liste.flatMap(sg => ((bulunan && bulunan.ek && bulunan.ek[sg.yuva]) || [])
      .filter(m => desen.test(m) && !sg.modeller.includes(m)).map(m => [`ek${sg.yuva}:${m}`, `${sg.ad} · ${m}`]));
    const ekSec = (id, deger, desen, basta = []) => { const el = $(id); const v = el.options.length ? el.value : (deger || "");
      const l = [["", "— seç —"], ...basta, ...uygunlar(desen), ...ekler];
      if (v && !l.some(([k]) => k === v)) l.push([v, v]);
      el.innerHTML = l.map(([k, t]) => `<option value="${esc(k)}" ${k === v ? "selected" : ""}>${esc(t)}</option>`).join(""); };
    ekSec("#sesEkModel", a.SES_EK_MODEL, /tts|speech|audio|voice|sonic/i);
    // Görsel modelleri: sağlayıcıda bulunan + elle yazılan, adı görsel modeli olanlar
    const gorselDesen = /image|dall|imagen|flux|diffusion|sdxl|recraft|ideogram/i;
    kaynakCiz([...uygunlar(gorselDesen), ...ekler.filter(([k]) => gorselDesen.test(k))]);
    const tahminAyar = () => ({profil: $("#profil") ? $("#profil").value : a.MALIYET_PROFILI, saglayicilar: liste,
      kayitlar: maliyetKayit, ritim: $("#ritim") ? $("#ritim").value : a.URETIM_RITMI,
      saatSayisi: document.querySelectorAll(".saat").length || (a.YAYINLANMA_SAATLERI || []).length || 2,
      trendGunSayisi: document.querySelectorAll("[data-gun]").length
        ? document.querySelectorAll("[data-gun]:checked").length : (a.TREND_GUNLERI || []).length});
    const ta = tahminAyar();
    $("#gorevler").innerHTML = Object.entries(a.KANAL_TURU === "hikaye" ? GOREVLER_HIKAYE : GOREVLER).map(([k, ad]) => {
      const l = [...secenekler, ...(KAPATILABILIR.has(k) ? [["kapali", "⛔ Yapma (bu iş kapalı)"]] : [])];
      if (gorevSecim[k] && !l.some(([v]) => v === gorevSecim[k])) l.push([gorevSecim[k], gorevSecim[k] + " (listede yok)"]);
      return `<label>${esc(ad)}${k === "guncel_konular" ? ' <span class="ince">(hangi günler: 🧠 İçerik → haber günleri)</span>' : KAPATILABILIR.has(k) ? "" : ' <span class="ince">(zorunlu)</span>'}</label>
      <select data-gorev="${k}">${l.map(([v, t]) => `<option value="${esc(v)}" ${(gorevSecim[k] || "") === v ? "selected" : ""}>${esc(t)} — ${dolar(aylikMaliyet(k, v, ta))}/ay</option>`).join("")}</select>
      <p class="ince" style="margin-top:2px" data-tahmin="${k}"></p>
      ${GOREV_KAPALI_NOTU[k] ? `<p class="ince" style="margin-top:2px">⛔ seçilirse: ${GOREV_KAPALI_NOTU[k]}</p>` : ""}`;
    }).join("");
    tahminYaz = () => {
      const t = tahminAyar();
      const sifir = a.MALIYET_SIFIR ? new Date(a.MALIYET_SIFIR) : null;
      const gercek = (maliyetKayit || []).filter(k => !sifir || new Date(k.zaman) >= sifir);
      const gercekIs = is => { const l = gercek.filter(k => k.is === is); return [l.reduce((x, k) => x + (k.usd || 0), 0), l.length]; };
      let toplam = 0, eksik = false;
      document.querySelectorAll("[data-gorev]").forEach(sel => {
        const k = sel.dataset.gorev, m = aylikMaliyet(k, sel.value, t), n = aylikCagri(k, t);
        if (m == null) eksik = true; else toplam += m;
        const [gu, gs] = gercekIs(k);
        document.querySelector(`[data-tahmin="${k}"]`).textContent = (sel.value === "kapali" ? "💰 tahmin: 0 $ (kapalı)"
          : `💰 tahmin: ${dolar(m)}/ay${m != null ? ` (~${Math.round(m * TL_KURU)} ₺)` : ""} · ayda ~${n} kez`)
          + ` · 🧾 harcanan: ${gu.toFixed(3).replace(".", ",")} $ (${gs} kez)`;
      });
      const gToplam = gercek.reduce((x, k) => x + (k.usd || 0), 0);
      const kredi = gercek.filter(k => k.is === "seslendirme_kredi").reduce((x, k) => x + (k.kredi || 0), 0);
      const gorsel = gercek.filter(k => k.is === "ai_gorsel");

    if (yeni.KANAL_TURU === "hikaye" && !document.querySelector("[data-hseri]:checked")) return bildir("📺 En az bir hikâye serisi işaretli olmalı.");

    if (yeni.HIKAYE_SES_ID && !/^[0-9a-zA-Z]{10,40}$/.test(yeni.HIKAYE_SES_ID)) return bildir("Masalcı ses kimliği sadece harf ve rakamdan oluşmalı.");
    if (Object.keys(STIL_TURLERI).some(t => !document.querySelector(`[data-stil="${t}"]:checked`)))
      return bildir("🎬 Görünüm kartında her stil türünden en az bir seçenek işaretli olmalı.", 5000);
    if (!yeni.GORSEL_KAYNAKLARI.length) return bildir("🖼️ Görüntüler kartında en az bir kaynağı işaretle.");
    for (const h of [yeni.CLOUDFLARE_HESAP, yeni.CLOUDFLARE_HESAP_2])
      if (h && !/^[0-9a-zA-Z]{16,64}$/.test(h)) return bildir("Cloudflare hesap numarası sadece harf ve rakamdan oluşmalı (32 hane).", 5000);
    if (yeni.CLOUDFLARE_AKTIF === 2 && !yeni.CLOUDFLARE_HESAP_2) return bildir("2. hesabı seçtin ama 2. hesap numarası boş.", 5000);
    if (yeni.GORSEL_KAYNAKLARI.some(k => k.startsWith("ai:cloudflare:")) && !yeni.CLOUDFLARE_HESAP)
      return bildir("Cloudflare için hesap numarasını (Account ID) gir.", 5000);
    if (yeni.SES_MOTORU === "ek" && !yeni.SES_EK_MODEL) return bildir("Ek sağlayıcı sesi için model seç.", 5000);
    $("#ayarKaydet").disabled = true;
    try {
      // Sayfa açıkken bot da ayarlar.json'u değiştirmiş olabilir (ör. kullanılan istek konuları silindi).
      // Taze dosyayı al, sadece BU SAYFADA değiştirdiğin alanları üzerine yaz.
      const taze = await dosyaOku("ayarlar.json", {});
      const sonuc = {...(typeof taze === "object" && taze ? taze : {})};
      let degisen = 0;
      for (const [k, deger] of Object.entries(yeni)) {
        if (JSON.stringify(deger) !== JSON.stringify(a[k])) { sonuc[k] = deger; degisen++; }
        else if (!(k in sonuc)) sonuc[k] = deger;
      }
      for (const [ayar] of Object.values(BICIMLER))      // varsayılanla aynıysa yazma (sonraki iyileştirmeler gelsin)
        if (JSON.stringify(sonuc[ayar]) === JSON.stringify(VARSAYILAN_AYARLAR[ayar])) delete sonuc[ayar];
      if (!degisen) { bildir("Değişiklik yok."); $("#ayarKaydet").disabled = false; return; }
      await dosyaYaz("ayarlar.json", sonuc, "Panel: ayarlar güncellendi");
      Object.assign(a, yeni); AYAR_VID = {...AYAR_VID, ...yeni};
      bildir(`✅ Ayarlar kaydedildi (${degisen} değişiklik).`);
    }
    catch (e) { bildir("❌ " + e.message, 6000); }
    $("#ayarKaydet").disabled = false;
  };
}

// 📖 Hikâye performansı: hikaye.performans_tablosu() ile aynı hesap (izlenme 7 günlük karşılığa çevrilir)
function hikayePerformansi(perf, plan) {
  const p = {}; (plan || []).forEach(v => { if (v.youtube_id && v.tur === "hikaye") p[v.youtube_id] = v; });
  const satir = [];
  for (const v of (perf && perf.videolar) || []) {
    const x = p[v.youtube_id]; if (!x) continue;
    const yas = Math.round((new Date(perf.tarih) - new Date(v.yayin)) / 864e5);
    if (!(yas >= 2)) continue;
    satir.push({...x, izl: (v.izlenme || 0) * 7 / Math.min(Math.max(yas, 2), 7), yuzde: v.izlenme_yuzdesi, pay: v.paylasim || 0});
  }
  if (!satir.length) return hikayeKanali() ? `<div class="kart"><h3>📖 Hikâye performansı</h3><p class="alt">Henüz ölçülmüş hikâye videosu yok (videolar 2 günlük olunca sayılır).
    En az 3 video olunca sistem bu tabloya göre seçim yapmaya başlar.</p></div>` : "";
  const grup = (alan, ad) => {
    const g = {}; satir.forEach(r => { if (r[alan]) (g[r[alan]] = g[r[alan]] || []).push(r); });
    const l = Object.entries(g).map(([k, rs]) => [k, rs.length, rs.reduce((t, r) => t + r.izl, 0) / rs.length,
      rs.filter(r => r.yuzde).reduce((t, r) => t + r.yuzde, 0) / Math.max(1, rs.filter(r => r.yuzde).length), rs.reduce((t, r) => t + r.pay, 0) / rs.length])
      .sort((a, b) => b[2] - a[2]);
    if (!l.length) return "";
    const enIyi = l[0][2] || 1;
    return `<h4 style="margin-top:12px">${ad}</h4>` + l.map(([k, n, izl, y, pay]) => `<div style="margin-top:6px"><div class="satir">
      <span>${esc(alan === "seri" ? k : bicimAdi(alan, k))} <span class="ince">(${n} video)</span></span>
      <span style="text-align:right">~${Math.round(izl)} izl/hafta · %${y.toFixed(0)} · ${pay.toFixed(1)} paylaşım</span></div>
      <div class="cubuk"><i style="width:${100 * izl / enIyi}%"></i></div></div>`).join("");
  };
  return `<div class="kart"><h3>📖 Hikâye performansı</h3>
    <p class="ince">${satir.length} hikâye videosu · izlenme 7 günlük karşılığa çevrildi · % = videonun ortalama ne kadarı izlendi.
      ${satir.length < 3 ? "En az 3 video olunca sistem seçimlerde bu tabloyu kullanır." : `Sistem seçimlerde bunu kullanıyor (${{dengeli: "dengeli", agresif: "agresif", kapali: "kapalı"}[vAyar("HIKAYE_OGRENME")] || "dengeli"}).`}</p>
    ${grup("kalip", "🧩 Anlatım kalıbı")}${grup("ton", "🎭 Ton")}${grup("kapanis", "🎬 Kapanış")}${grup("seri", "📺 Seri")}</div>`;
}

  }
  const liste = l => (l || []).map(x => `<li>${esc(x)}</li>`).join("");
  html += st && st.ozet ? `<div class="kart"><h3>🧠 Sistemin öğrendikleri</h3>

      <b>📺 Seri öncelikleri</b>${Object.entries(st.seri_agirliklari || {}).sort((a, b) => b[1] - a[1]).map(([ad, a]) => `
        <div style="margin-top:6px"><div class="satir"><span>${esc(ad)}</span><span style="text-align:right">${a.toFixed(1)}×</span></div>

      ${st.deneme ? `<p class="alt">🧪 Bu hafta denenecek: ${esc(st.deneme)}</p>` : ""}

    </div>` : `<div class="kart"><h3>🧠 Sistemin öğrendikleri</h3><p class="alt">İlk analiz yeterli veri birikince (en az 6 video) Perşembe üretiminde yapılır.</p></div>`;
  if (perf && (perf.videolar || []).length) {

    html += `<div class="kart"><h3>📊 Kanal performansı</h3><p class="ince">Son güncelleme: ${esc(perf.tarih)} · ${perf.videolar.length} video</p>

    Object.values(uyari || {}).forEach(u => satir.push(["kirmizi", `🚨 <b>${esc(u.baslik)}</b>${u.cozum ? `<div class="ince">👉 ${esc(u.cozum)}</div>` : ""}
      <div class="ince">${esc(new Date(u.zaman).toLocaleString("tr-TR", {day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"}))}</div>`]));
    if (ayar.URETIM_DURAKLAT) satir.push(["sari", `⏸️ <b>Otomatik üretim duraklatıldı.</b> <span class="ince">Ayarlar → 📅 Yayın ve onay'dan aç.</span>`]);
    const limit = +ayar.AYLIK_BUTCE || 0;
    if (limit > 0) {
      const ay = new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 7);
      const harcanan = (mal || []).filter(k => String(k.zaman).startsWith(ay)).reduce((t, k) => t + (k.usd || 0), 0);
      if (harcanan >= limit * 0.8) satir.push([harcanan >= limit ? "kirmizi" : "sari",
        `💵 Bu ay ${harcanan.toFixed(2)} $ / ${limit} $ bütçe${harcanan >= limit ? (ayar.BUTCE_DAVRANIS === "dur" ? " — <b>doldu, otomatik üretim durdu</b>" : " — <b>doldu, en ucuz modelle devam ediliyor</b>") : " (%80'i geçti)"}`]);
    }
    if (!(uyari || {}).bakiye) {
      const izlenen = ["Haftalık Video Üretimi", "Videoyu Yeniden Üret", "Onay ve YouTube Yükleme"];
      const son = {};
      (isler.workflow_runs || []).filter(x => x.status === "completed").forEach(x => { if (!son[x.name]) son[x.name] = x; });
      Object.values(son).filter(x => izlenen.includes(x.name) && x.conclusion === "failure").forEach(x => satir.push(["kirmizi",
        `❌ Son <b>${esc(x.name)}</b> işi başarısız oldu (${new Date(x.created_at).toLocaleString("tr-TR", {day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"})}).
        <a href="${esc(x.html_url)}" target="_blank" style="color:inherit">Ayrıntı</a> · <span class="ince">Bir sonraki başarılı işte bu uyarı kalkar.</span>`]));
    }
    $("#uyariSerit").innerHTML = satir.map(([tur, h]) => `<div class="${tur === "kirmizi" ? "kirmiziSerit" : "uyari"}" style="margin-top:8px">${h}</div>`).join("");
  } catch (e) {}
}
// 💡 Haftalık analizin ayar önerileri (strateji.json → oneriler). Kararlar ayarlar.json ONERI_KARARLARI'nda.
// ayarlar.py STIL_SECENEKLERI ile aynı adlar
const STIL_TURLERI = {
  vurgu: ["🎨 Vurgu rengi (o an söylenen kelime)", [["sari", "Sarı"], ["camgobegi", "Camgöbeği"], ["yesil", "Yeşil"], ["turuncu", "Turuncu"], ["pembe", "Pembe"]]],
  altyazi: ["📍 Altyazı yeri", [["en_alt", "En alt"], ["alt", "Alt"], ["orta_alt", "Orta-alt"], ["orta", "Orta"]]],
  gecis: ["🎞️ Sahne geçişi", [["kesme", "Kesme"], ["karartma", "Kararma"], ["flas", "Flaş"]]],
  zoom: ["🔍 Fotoğraf zoom yönü", [["iceri", "İçeri"], ["disari", "Dışarı"]]],
};
const stilAdi = (tur, k) => ((STIL_TURLERI[tur] || [, []])[1].find(x => x[0] === k) || [, k])[1];
const ONERI_ADLARI = {STIL_TERCIHLERI: "🎬 Görsel stil", KARARTMA: "🌑 Görüntü karartma",KONU_NOTU: "📝 Konu talimatı", SENARYO_NOTU: "✍️ Senaryo talimatı", GORSEL_NOTU: "🎨 Görsel talimatı", ANIMASYON_STILI: "🎬 Animasyon çizim stili",
  KATEGORILER: "📚 Konu alanları", OZEL_KONULAR: "🎯 Belirli konular", TREND_GUNLERI: "📰 Güncel haber günleri",
  GUNLUK_SURE: "⏱️ Günlük video süresi", HIKAYE_SURE: "⏱️ Hikâye süresi", HIKAYE_STILI: "🪟 Hikâye çizim stili", HIKAYE_SERI_ACIK: "📺 Açık hikâye serileri", HIKAYE_KALIP_ACIK: "🧩 Açık anlatım kalıpları", HIKAYE_TON_ACIK: "🎭 Açık tonlar", HIKAYE_KAPANIS_ACIK: "🎬 Açık kapanışlar", YAYINLANMA_SAATLERI: "🕐 Yayın saatleri", UYGUNLUK_KONTROLU: "🔍 Görüntü uygunluk kontrolü"};
const oneriDeger = (alan, d) => alan === "STIL_TERCIHLERI" ? (d && d.tur ? `${STIL_TURLERI[d.tur][0]}: sadece ${d.secenekler.map(k => stilAdi(d.tur, k)).join(", ")}`
    : Object.entries(d || {}).filter(([, v]) => (v || []).length).map(([t, v]) => `${STIL_TURLERI[t][0]}: ${v.map(k => stilAdi(t, k)).join(", ")}`).join(" · ") || "hepsi karışık") :
  alan === "KARARTMA" ? `%${Math.round(+d * 100)}` : alan === "TREND_GUNLERI" ? (d.length ? d.map(i => GUN_ADLARI[i]).join(", ") : "hiç") :
  alan === "HIKAYE_SERI_ACIK" ? (d.length ? d.join(", ") : "hepsi") :
  alan === "HIKAYE_KALIP_ACIK" || alan === "HIKAYE_TON_ACIK" || alan === "HIKAYE_KAPANIS_ACIK" ?
    (d.length ? d.map(k => bicimAdi({HIKAYE_KALIP_ACIK: "kalip", HIKAYE_TON_ACIK: "ton", HIKAYE_KAPANIS_ACIK: "kapanis"}[alan], k)).join(", ") : "hepsi") : ["GUNLUK_SURE", "HIKAYE_SURE"].includes(alan) ? (d >= 60 ? (d / 60 + " dk").replace(".", ",") : d + " sn") : Array.isArray(d) ? d.join(", ") : String(d);
function oneriUygula(ayar, o) {
  const liste = ["KATEGORILER", "OZEL_KONULAR"].includes(o.alan);
  if (o.islem === "ekle") {
    if (liste) ayar[o.alan] = [...(ayar[o.alan] || VARSAYILAN_AYARLAR[o.alan] || []), o.deger];
    else ayar[o.alan] = [String(ayar[o.alan] || "").trim(), o.deger].filter(Boolean).join("\n");
  } else if (o.islem === "cikar" || o.islem === "degistir") {
    const yeni = o.islem === "degistir" ? o.deger : null;
    if (liste) {
      const eski = [...(ayar[o.alan] || VARSAYILAN_AYARLAR[o.alan] || [])];
      const i = eski.findIndex(m => String(m).trim().toLowerCase() === String(o.eski).trim().toLowerCase());
      if (i < 0) throw new Error("Bu madde artık ayarlarında yok (sen değiştirmişsin); öneri uygulanamadı.");
      if (yeni) eski[i] = yeni; else eski.splice(i, 1);
      ayar[o.alan] = eski;
    } else {
      const metin = String(ayar[o.alan] ?? VARSAYILAN_AYARLAR[o.alan] ?? "");
      if (!metin.includes(o.eski)) throw new Error("Bu cümle artık talimatında yok (sen değiştirmişsin); öneri uygulanamadı.");
      ayar[o.alan] = metin.replace(o.eski, yeni || "").replace(/[ \t]{2,}/g, " ").replace(/[ \t]+\n/g, "\n").replace(/\n{2,}/g, "\n").replace(/^\s+|\s+$/g, "");
    }
  } else if (o.alan === "STIL_TERCIHLERI") {
    ayar.STIL_TERCIHLERI = {...(ayar.STIL_TERCIHLERI || {}), [o.deger.tur]: o.deger.secenekler};
  } else ayar[o.alan] = o.deger;
}
function oneriYazi(o, ayar) {
  if (o.islem === "ekle") return `➕ “${esc(o.deger)}” eklensin`;
  if (o.islem === "cikar") return `➖ “${esc(o.eski)}” çıkarılsın`;
  if (o.islem === "degistir") return `🔄 “${esc(o.eski)}” yerine → “${esc(o.deger)}” olsun`;
  if (o.alan === "STIL_TERCIHLERI") {
    const simdi = ((ayar.STIL_TERCIHLERI || {})[o.deger.tur] || []);
    return `→ <b>${esc(oneriDeger(o.alan, o.deger))}</b> <span class="ince">(şu an: ${simdi.length ? esc(simdi.map(k => stilAdi(o.deger.tur, k)).join(", ")) : "hepsi karışık"})</span>`;
  }
  return `→ <b>${esc(oneriDeger(o.alan, o.deger))}</b> olsun <span class="ince">(şu an: ${esc(oneriDeger(o.alan, ayar[o.alan] ?? VARSAYILAN_AYARLAR[o.alan] ?? ""))})</span>`;
}
async function oneriSeridi() {
  try {
    const [st, ayar] = await Promise.all([dosyaOku("strateji.json", null), dosyaOku("ayarlar.json", {})]);
    const kararlar = ayar.ONERI_KARARLARI || {};
    const bekleyen = ((st && st.oneriler) || []).filter(o => !kararlar[o.id]);
    if (!bekleyen.length) { $("#oneriSerit").innerHTML = ""; return; }
    $("#oneriSerit").innerHTML = `<div class="kart" style="margin-top:8px;border-color:var(--mavi)">
      <b>💡 Sistemin önerileri</b> <span class="ince">· ${esc(st.tarih)} haftalık analizinden · onaylamadan hiçbir ayar değişmez</span>
      ${bekleyen.map(o => {
        return `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--cizgi)">
          <div><b>${esc(ONERI_ADLARI[o.alan] || o.alan)}</b>: ${oneriYazi(o, ayar)}</div>
          ${o.neden ? `<div class="ince">Neden: ${esc(o.neden)}</div>` : ""}
          <div class="satir" style="margin-top:6px"><button class="ana" data-oneri="${esc(o.id)}" data-karar="uygulandi">✅ Uygula</button>
            <button data-oneri="${esc(o.id)}" data-karar="gecildi">✖ Geç</button></div></div>`;
      }).join("")}</div>`;
    document.querySelectorAll("[data-oneri]").forEach(b => b.onclick = async () => {
      const o = bekleyen.find(x => x.id === b.dataset.oneri);
      document.querySelectorAll(`[data-oneri="${o.id}"]`).forEach(x => x.disabled = true);
      try {
        const taze = await dosyaOku("ayarlar.json", {});
        if (b.dataset.karar === "uygulandi") oneriUygula(taze, o);
        taze.ONERI_KARARLARI = {...(taze.ONERI_KARARLARI || {}), [o.id]: b.dataset.karar};
        await dosyaYaz("ayarlar.json", taze, `Panel: öneri ${b.dataset.karar === "uygulandi" ? "uygulandı" : "geçildi"} (${o.alan})`);
        bildir(b.dataset.karar === "uygulandi" ? "✅ Uygulandı, bir sonraki üretimde geçerli." : "Geçildi, bir daha önerilmeyecek.", 4000);
        oneriSeridi();
        if (SEKME === "ayarlar") sekmeAc("ayarlar");
      } catch (e) { bildir("❌ " + e.message, 6000); document.querySelectorAll(`[data-oneri="${o.id}"]`).forEach(x => x.disabled = false); }
    });
  } catch (e) {}
}
async function basla() {
  if (!TOKEN) return kurulumEkrani();
  $("#sekmeler").style.display = "";
  izinSeridi(); setInterval(izinSeridi, 10 * 60 * 1000);
  uyariSeridi(); setInterval(uyariSeridi, 5 * 60 * 1000);
  oneriSeridi();
  try { const u = await (await gh("/user")).json(); $("#kullanici").textContent = u.login || ""; } catch (e) {}
  sekmeAc("videolar");
}
basla();
</script>
