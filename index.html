};
// Panelde "⛔ Yapma" seçilebilen işler (ortak.KAPATILABILIR_GOREVLER ile aynı)
const KAPATILABILIR = new Set(["guncel_konular", "hook_secimi", "dogrulama", "seri_yorum", "strateji"]);
const GOREV_KAPALI_NOTU = {

};
// ── Aylık maliyet tahmini (ayarlar.py FIYATLAR / MALIYET_PROFILLERI / WEB_ARAMA_FIYATI ile aynı) ──
const FIYATLAR = {"claude-opus-5-5": [4.00, 20.00], "claude-sonnet-5-5": [2.00, 10.00], "claude-haiku-5-5": [0.10, 0.50]};
const WEB_ARAMA_FIYATI = 0.01, TL_KURU = 34;
const PROFIL_MODELLERI = {   // "Varsayılan" seçilince hangi model çalışır
  ekonomik: {senaryo: "claude-sonnet-5-5", dogrulama: "claude-haiku-5-5"},
  dengeli: {senaryo: "claude-opus-5-5", dogrulama: "claude-sonnet-5-5"},
  kalite: {senaryo: "claude-opus-5-5", dogrulama: "claude-sonnet-5-5"},
};
const VARSAYILAN_GOREV_MODELI = {guncel_konular: "claude-sonnet-5-5", evergreen_konular: "claude-sonnet-5-5",
  hook_secimi: "claude-haiku-5-5", detaylar: "claude-haiku-5-5", seri_yorum: "claude-haiku-5-5", strateji: "claude-sonnet-5-5"};
// Ölçüm yoksa kullanılan tipik çağrı büyüklükleri (11 Kasım 2026 ölçümü): [giriş token, çıkış token, web araması]
const TIPIK_CAGRI = {guncel_konular: [24650, 490, 3], evergreen_konular: [2640, 460, 0], senaryo: [1850, 2570, 0],
  hook_secimi: [1620, 920, 0], dogrulama: [13730, 1830, 2], detaylar: [1150, 1510, 0], seri_yorum: [810, 510, 0], strateji: [6000, 1500, 0]};
function modelFiyati(model, saglayicilar) {
  if (!model) return null;
  if (model.startsWith("ek")) {
    const [yuva, ...ad] = model.slice(2).split(":");
    const sg = (saglayicilar || []).find(x => +x.yuva === +yuva);
    return sg ? (sg.fiyat || [0, 0]).map(Number) : null;
  }
  if (FIYATLAR[model]) return FIYATLAR[model];
  const aile = Object.keys(FIYATLAR).find(k => model.includes(k.split("-")[1]));
  return aile ? FIYATLAR[aile] : [4.00, 20.00];   // yeni / bilinmeyen Claude modeli: en pahalı fiyatla tahmin
}
function aylikCagri(is, ayar) {
  const video = (ayar.saatSayisi || 2) * 30, gunluk = ayar.ritim !== "haftalik";
  return {senaryo: video, hook_secimi: video, dogrulama: video, detaylar: video,
          guncel_konular: gunluk ? 30 : 8, evergreen_konular: gunluk ? 30 : 8, strateji: 4, seri_yorum: 0}[is] ?? 0;
}
function cagriBuyuklugu(is, kayitlar) {
  const l = (kayitlar || []).filter(k => k.is === is && (k.giris || k.cikis));
  if (!l.length) return TIPIK_CAGRI[is] || [2000, 1000, 0];
  const ort = f => l.reduce((t, k) => t + (k[f] || 0), 0) / l.length;
  return [ort("giris"), ort("cikis"), ort("arama")];
}
// Bir iş için seçilen modelle aylık tahmini $ (null = hesaplanamadı)
function aylikMaliyet(is, secim, ayar) {
  if (secim === "kapali") return 0;
  const model = secim || (PROFIL_MODELLERI[ayar.profil] || PROFIL_MODELLERI.dengeli)[is] || VARSAYILAN_GOREV_MODELI[is];
  const f = modelFiyati(model, ayar.saglayicilar);
  if (!f) return null;
  const [g, c, ara] = cagriBuyuklugu(is, ayar.kayitlar);
  const tek = g / 1e6 * f[0] + c / 1e6 * f[1] + (model.startsWith("claude") ? ara * WEB_ARAMA_FIYATI : 0);
  return tek * aylikCagri(is, ayar);
}
const dolar = x => x == null ? "fiyat girilmemiş" : x < 0.005 ? "~0 $" : `~${x.toFixed(2).replace(".", ",")} $`;
const CLAUDE_MODELLERI = [["claude-opus-5-5", "Claude Opus 5.5 (en iyi, pahalı)"], ["claude-sonnet-5-5", "Claude Sonnet 5.5 (orta)"],
                          ["claude-haiku-5-5", "Claude Haiku 5.5 (en ucuz)"]];
const HAZIR_SAGLAYICILAR = {
  "": ["Diğer (OpenAI uyumlu)", ""], deepseek: ["DeepSeek", "https://api.deepseek.com/v1"],
  gemini: ["Google Gemini", "https://generativelanguage.googleapis.com/v1beta/openai"],

};
const GUN_ADLARI = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
const DURUM = {
  bekliyor: ["⏳ Sırada", ""], seslendirildi: ["🎙️ Üretiliyor", ""], video_hazir: ["🎬 Onay bekliyor", "hazir"],
  onaylandi: ["👍 Onaylandı", "onay"], reddedildi: ["👎 Reddedildi", "red"], yuklendi: ["✅ YouTube'da", "yuk"],
};

let TOKEN = localStorage.getItem("ytb_token") || "";
let DEPO = localStorage.getItem("ytb_depo") || VARSAYILAN_DEPO;
let PLAN = [], RELEASES = {}, KARARLAR = {}, SEKME = "videolar";

// ─────────────────────────────────────────

// ─────────────────────────────────────────
const $ = (s, k = document) => k.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function bildir(metin, sure = 3500) {

  clearTimeout(bildir.t); bildir.t = setTimeout(() => b.style.display = "none", sure);
}
function b64Kodla(metin) {
  const bayt = new TextEncoder().encode(metin); let s = "";
  for (let i = 0; i < bayt.length; i += 0x8000) s += String.fromCharCode.apply(null, bayt.subarray(i, i + 0x8000));
  return btoa(s);
}
async function gh(yol, ayar = {}) {
  let r;
  for (let deneme = 0; ; deneme++) {   // telefon ağı / VPN kısa kopmalarında 3 kez dene
    try {
      r = await fetch(yol.startsWith("http") ? yol : "https://api.github.com" + yol, {
        ...ayar,
        headers: {Authorization: "Bearer " + TOKEN, Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", ...(ayar.headers || {})},
      });
      break;
    } catch (e) {
      if (deneme >= 2) throw new Error("GitHub'a bağlanılamadı (internet ya da VPN). VPN'i kapatıp sayfayı yenile.");
      await new Promise(c => setTimeout(c, 1500 * (deneme + 1)));
    }
  }
  if (!r.ok && r.status !== 404) {
    let m = ""; try { m = (await r.json()).message; } catch (e) {}
    throw new Error(`GitHub ${r.status}: ${m}`);
  }
  return r;
}
async function dosyaOku(yol, varsayilan = null) {
  const r = await gh(`/repos/${DEPO}/contents/${yol}?ref=main&t=${Date.now()}`,
                     {headers: {Accept: "application/vnd.github.raw+json"}});
  if (r.status === 404) return varsayilan;
  const metin = await r.text();
  try { return JSON.parse(metin); } catch (e) { return metin; }
}
async function dosyaYaz(yol, icerik, mesaj) {
  const metin = typeof icerik === "string" ? icerik : JSON.stringify(icerik, null, 2);
  const mevcut = await gh(`/repos/${DEPO}/contents/${yol}?ref=main&t=${Date.now()}`);
  const sha = mevcut.status === 404 ? undefined : (await mevcut.json()).sha;
  await gh(`/repos/${DEPO}/contents/${yol}`, {method: "PUT",
    body: JSON.stringify({message: mesaj, content: b64Kodla(metin), sha, branch: "main"})});
}
// Tetik: bu dosya değişince ilgili GitHub Actions işi başlar (commit mesajında [tetik] olmalı)
// ─── Anahtar kasası: anahtar telefonda depodaki açık anahtarla (RSA-OAEP) şifrelenir, sadece SIFRE'yi bilen işler çözer
async function kasaDurumu() {
  const r = await gh(`/repos/${DEPO}/contents/kasa?ref=main&t=${Date.now()}`);
  if (r.status === 404) return {kurulu: false, adlar: [], dosyalar: []};
  const l = await r.json();
  const adlar = l.map(x => x.name);
  return {kurulu: adlar.includes("acik_anahtar.pem"), dosyalar: l,
          adlar: adlar.filter(n => n.endsWith(".enc") && n !== "gizli_anahtar.enc").map(n => n.slice(0, -4))};
}
async function kasayaYaz(ad, deger) {
  const pem = await dosyaOku("kasa/acik_anahtar.pem", null);
  if (!pem || typeof pem !== "string") throw new Error("Kasa kurulu değil: İşler → 🔑 Anahtar testi'ni bir kez çalıştır.");
  const der = Uint8Array.from(atob(pem.replace(/-----[^-]+-----/g, "").replace(/\s+/g, "")), c => c.charCodeAt(0));
  const k = await crypto.subtle.importKey("spki", der, {name: "RSA-OAEP", hash: "SHA-256"}, false, ["encrypt"]);
  const sif = new Uint8Array(await crypto.subtle.encrypt({name: "RSA-OAEP"}, k, new TextEncoder().encode(deger.trim())));
  let b = ""; sif.forEach(x => b += String.fromCharCode(x));
  await dosyaYaz(`kasa/${ad}.enc`, btoa(b), `Panel: ${ad} anahtar kasasına eklendi (şifreli)`);
}
async function kasadanSil(ad) {
  const r = await gh(`/repos/${DEPO}/contents/kasa/${ad}.enc?ref=main&t=${Date.now()}`);
  if (r.status === 404) return;
  const {sha} = await r.json();
  await gh(`/repos/${DEPO}/contents/kasa/${ad}.enc`, {method: "DELETE",
    body: JSON.stringify({message: `Panel: ${ad} anahtar kasasından kaldırıldı`, sha, branch: "main"})});
}

// Panel istekleri kuyruğa EKLENİR (üzerine yazılmaz) → GitHub bir işi iptal etse bile istek kaybolmaz
async function kuyrugaEkle(dosya, veri, aciklama) {
  const mevcut = await dosyaOku(`tetik/${dosya}`, {});
  const islenen = await dosyaOku("tetik/islenen.json", {});
  const tur = dosya.replace(".json", "");
  const biten = new Set(((islenen || {})[tur] || []).map(String));
  const sinir = Date.now() - 14 * 864e5;
  let liste = (mevcut && Array.isArray(mevcut.istekler)) ? mevcut.istekler : [];
  liste = liste.filter(i => !biten.has(String(i.no)) || new Date(i.zaman || 0).getTime() > sinir);
  liste.push({...veri, no: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), zaman: new Date().toISOString()});
  await dosyaYaz(`tetik/${dosya}`, {istekler: liste.slice(-100), not: "Panel istek kuyruğu. İşlenenler tetik/islenen.json'da."},
                 `[tetik] Panel: ${aciklama}`);
}
async function bekleyenIstekler() {
  try {
    const [o, y, i] = await Promise.all([dosyaOku("tetik/onay.json", {}), dosyaOku("tetik/yeniden.json", {}), dosyaOku("tetik/islenen.json", {})]);
    const biten = t => new Set((((i || {})[t]) || []).map(String));
    const bo = biten("onay"), by = biten("yeniden");
    return [...((o && o.istekler) || []).filter(x => !bo.has(String(x.no))),
            ...((y && y.istekler) || []).filter(x => !by.has(String(x.no))).map(x => ({...x, yeniden: true}))];
  } catch (e) { return []; }
}

async function tetikle(dosya, veri, aciklama) {

                 `[tetik] Panel: ${aciklama}`);
}
function modalAc(html) { $("#modalIcerik").innerHTML = html; $("#modal").style.display = "flex"; }
function modalKapat() { $("#modal").style.display = "none"; $("#modalIcerik").innerHTML = ""; }

function kurulumEkrani(hata = "") {
  $("#sekmeler").style.display = "none";
  $("#ana").innerHTML = `
    <div class="kart">
      <h3>🔐 İlk kurulum</h3>

      ${hata ? `<div class="hata">${esc(hata)}</div>` : ""}
      <label>GitHub token</label><input id="tokenGiris" type="password" placeholder="github_pat_..." autocomplete="off">
      <label>Depo</label><input id="depoGiris" value="${esc(DEPO)}">
      <div class="butonlar"><button class="ana" id="tokenKaydet">Kaydet ve bağlan</button></div>
    </div>`;
  $("#tokenKaydet").onclick = async () => {

async function releaseAl(etiket) {
  if (RELEASES[etiket] !== undefined) return RELEASES[etiket];
  const r = await gh(`/repos/${DEPO}/releases/tags/${etiket}`);
  RELEASES[etiket] = r.status === 404 ? null : await r.json();
  return RELEASES[etiket];
}
async function assetBul(v) {
  if (!v.release) return null;
  const rel = await releaseAl(v.release);
  return rel ? {rel, asset: (rel.assets || []).find(a => a.name === v.id + ".mp4")} : null;
}

const AY_ADLARI = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
function yayinZamani(v) { return new Date(String(v.yayinlanma).replace(" ", "T") + ":00+03:00"); }
function zamanYazi(v) {
  const d = yayinZamani(v), fark = (d - Date.now()) / 864e5;
  const goreli = fark > 0 ? (fark < 1 ? `${Math.max(1, Math.round(fark * 24))} saat sonra` : `${Math.round(fark)} gün sonra`)
                          : (fark > -1 ? "bugün" : `${Math.round(-fark)} gün önce`);
  return `${esc(v.gun)} ${d.getDate()} ${AY_ADLARI[d.getMonth()]} · <b>${esc(v.saat)}</b> <span class="alt">(${goreli})</span>`;
}
function videoGrubu(v) {
  if (v.durum === "yuklendi") return (v.hemen || yayinZamani(v) <= new Date()) ? "yayinda" : "zamanli";
  return {onaylandi: "sirada", video_hazir: "onay", reddedildi: "red"}[v.durum] || "uretim";
}
const GRUP = {
  yayinda: ["✅ Yayında", "onay"],
  zamanli: ["⏰ YouTube'a yüklendi (gizli) — saati gelince kendiliğinden yayınlanacak", "yuk"],
  sirada:  ["📤 Hazır — yayınına yakın YouTube'a yüklenecek (11:07), saatinde yayınlanacak", ""],
  onay:    ["👀 Onayını bekliyor", "hazir"],
  uretim:  ["🎬 Üretilecek (yayın günü sabahı)", ""],
  red:     ["❌ Reddedildi", "red"],
};
let BEKLEYEN = [], YORUMLAR = {}, VIDEO_MALIYET = {};
const IS_ADLARI = {senaryo: "senaryo", hook_secimi: "açılış seçimi", dogrulama: "bilgi doğrulama", detaylar: "başlık/görsel",
  seri_yorum: "seri+yorum", ai_gorsel: "yapay zekâ görseli", gorsel_kontrol: "görüntü kontrolü", seslendirme: "ek ses"};
function maliyetSatiri(id) {
  const m = VIDEO_MALIYET[id];
  if (!m) return "";
  const kur = 34;   // yaklaşık TL karşılığı için (bilgi amaçlı)
  const dokum = Object.entries(m.isler).sort((a, b) => b[1] - a[1])
    .map(([k, u]) => `${esc(IS_ADLARI[k] || k)} ${u.toFixed(3)} $`).join(" · ");
  return `<details class="ince" style="margin-top:4px"><summary>💰 ${m.usd.toFixed(3)} $ (~${(m.usd * kur).toFixed(1)} ₺)${m.kredi ? ` · 🎙️ ${m.kredi} ElevenLabs kredisi` : ""}</summary>
    ${dokum || "—"}<br>🔤 ${(m.giris / 1000).toFixed(1)}K giriş + ${(m.cikis / 1000).toFixed(1)}K çıkış token${m.arama ? ` · 🔎 ${m.arama} arama` : ""}</details>`;
}
function bekleyenVar(id) {
  return BEKLEYEN.some(i => i.id === id || String(i.hemen || "").split(",").includes(id) || String(i.reddet || "").split(",").includes(id)
    || String(i.onayla || "").split(",").includes(id) || (i.duzenle || []).some(d => d.id === id));
}
let VIDEO_FILTRE = (() => { try { return localStorage.getItem("ytb_filtre") || "sirada"; } catch (e) { return "sirada"; } })();

async function videolar() {
  $("#ana").innerHTML = `<p class="alt">Yükleniyor…</p>`;
  let maliyet;
  [PLAN, BEKLEYEN, YORUMLAR, maliyet] = await Promise.all([dosyaOku("haftalik_plan.json", []), bekleyenIstekler(),
    dosyaOku("yorumlar.json", {}), dosyaOku("maliyet.json", [])]);
  VIDEO_MALIYET = {};
  for (const k of (Array.isArray(maliyet) ? maliyet : [])) {
    if (!k.video) continue;
    const m = VIDEO_MALIYET[k.video] = VIDEO_MALIYET[k.video] || {usd: 0, kredi: 0, giris: 0, cikis: 0, arama: 0, isler: {}};
    m.usd += k.usd || 0; m.kredi += k.kredi || 0; m.giris += k.giris || 0; m.cikis += k.cikis || 0; m.arama += k.arama || 0;
    if (k.usd) m.isler[k.is] = (m.isler[k.is] || 0) + k.usd;
  }
  if (!PLAN.length) { $("#ana").innerHTML = `<div class="kart">Henüz video yok.</div>`; return; }
  const say = g => PLAN.filter(v => videoGrubu(v) === g).length;
  let html = `<div class="kart"><div class="satir" style="text-align:center">
      <div><b style="font-size:22px">${say("yayinda")}</b><div class="alt">✅ yayında</div></div>
      <div><b style="font-size:22px">${say("zamanli")}</b><div class="alt">⏰ YouTube'da bekliyor</div></div>
      <div><b style="font-size:22px">${say("sirada") + say("onay")}</b><div class="alt">📤 yüklenecek</div></div>
      <div><b style="font-size:22px">${say("uretim")}</b><div class="alt">🎬 üretilecek</div></div></div>
    <details style="margin-top:8px"><summary class="alt">ℹ️ Bir video nasıl yayınlanır?</summary><ol class="alt">
      <li><b>Her sabah 07:17</b>: o günün konuları seçilir (güncel haberler + kanalın öğrendikleri) → senaryo → ses → video; panelde <b>▶️ İzle</b> ile görünür.</li>
      <li>Onay modu "otomatik" ise hemen onaylanır ve YouTube'a <b>gizli + zamanlanmış</b> olarak yüklenir (kota dolarsa ertesi gün 11:07).</li>
      <li>Yayın saati gelince YouTube videoyu <b>kendiliğinden herkese açar</b>. O ana kadar başlığını, saatini değiştirebilir, silebilir ya da hemen yayınlayabilirsin.</li>
      <li>YouTube'a gitmeden önce bakmak istersen Ayarlar → Onay modu → "Pazar" ya da "Elle".</li></ol></details></div>
    <nav class="filtre" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px">
      ${[["sirada", "⏭️ Sıradakiler"], ["yayinda", "✅ Yayınlananlar"], ["hepsi", "🗂️ Haftalara göre"]].map(([k, ad]) =>
        `<button data-filtre="${k}" class="${VIDEO_FILTRE === k ? "aktif ana" : ""}">${ad}</button>`).join("")}
      <button id="yenile">↻</button><button id="uretBaslat">▶️ Üretimi başlat</button>
      <button id="yeniVideo" class="ana">⚡ Yeni video yaptır</button></nav>`;
  const yeniBekleyen = BEKLEYEN.filter(i => i.mod === "yeni");
  if (yeniBekleyen.length) html += `<div class="kart"><b>⚡ Hazırlanan yeni videoların</b>${yeniBekleyen.map(i =>
    `<div class="alt">⏳ ${esc(i.konu)} — ${i.yayinlanma ? esc(i.yayinlanma.replace("T", " ")) : "hazır olunca hemen"}</div>`).join("")}
    <p class="ince">Üretim ~5-10 dk sürer, sonra burada kart olarak görünür (↻ ile yenile).</p></div>`;
  if (VIDEO_FILTRE === "hepsi") {
    const haftalar = [...new Set(PLAN.map(v => v.hafta))].sort().reverse();
    for (const h of haftalar) {
      const vs = PLAN.filter(v => v.hafta === h).sort((a, b) => a.yayinlanma.localeCompare(b.yayinlanma));
      const bekleyen = vs.filter(v => v.durum === "video_hazir").length;
      html += `<h2 style="font-size:16px;margin:18px 0 8px">📅 ${esc(h)} haftası <span class="alt">(${vs.length} video)</span></h2>`;
      if (bekleyen) html += `<div class="butonlar" style="margin:0 0 10px"><button data-hepsi="${esc(h)}">✅ Bu haftanın ${bekleyen} videosunu onayla</button></div>`;
      vs.forEach(v => html += videoKarti(v));
    }
  } else {
    const liste = VIDEO_FILTRE === "yayinda"
      ? PLAN.filter(v => videoGrubu(v) === "yayinda").sort((a, b) => b.yayinlanma.localeCompare(a.yayinlanma))
      : PLAN.filter(v => !["yayinda", "red"].includes(videoGrubu(v))).sort((a, b) => a.yayinlanma.localeCompare(b.yayinlanma));
    if (!liste.length) html += `<div class="kart alt">Burada video yok.</div>`;
    let gun = "";
    for (const v of liste) {
      if (v.tarih !== gun) { gun = v.tarih; html += `<h2 style="font-size:15px;margin:16px 0 6px">${esc(v.gun)} · ${esc(v.tarih)}</h2>`; }
      html += videoKarti(v);
    }
  }
  $("#ana").innerHTML = html;
  document.querySelectorAll("[data-filtre]").forEach(b => b.onclick = () => {
    VIDEO_FILTRE = b.dataset.filtre; try { localStorage.setItem("ytb_filtre", VIDEO_FILTRE); } catch (e) {} videolar();
  });
  $("#yenile").onclick = () => { RELEASES = {}; videolar(); };
  $("#yeniVideo").onclick = yeniVideoModal;
  $("#uretBaslat").onclick = async () => {
    if (!confirm("Bekleyen konular için üretim başlatılsın mı? (Yeni hafta yoksa sadece bekleyenler üretilir.)")) return;
    try { await tetikle("uretim.json", {test: false}, "üretimi başlat"); bildir("▶️ Üretim başlatıldı. 'İşler' sekmesinden izleyebilirsin."); }
    catch (e) { bildir("❌ " + e.message, 6000); }
  };
  document.querySelectorAll("[data-hepsi]").forEach(b => b.onclick = () => {
    PLAN.filter(v => v.hafta === b.dataset.hepsi && v.durum === "video_hazir").forEach(v => KARARLAR[v.id] = "onay");
    kararCubugu(); videolar();
  });
  document.querySelectorAll("[data-islem]").forEach(b => b.onclick = () => videoIslem(b.dataset.islem, b.dataset.id, b));
  kararCubugu();
}

function videoKarti(v) {
  const grup = videoGrubu(v);
  const [durumYazi, durumSinif] = GRUP[grup];
  const karar = KARARLAR[v.id];
  const id = esc(v.id);
  let b = "";
  if (v.durum === "video_hazir") b += `
    <button data-islem="onay" data-id="${id}" class="${karar === "onay" ? "sec-onay" : ""}">✅ Onayla</button>
    <button data-islem="red" data-id="${id}" class="${karar === "red" ? "sec-red" : ""}">❌ Reddet</button>`;
  if (v.release) b += `<button data-islem="izle" data-id="${id}">▶️ İzle</button>
    <button data-islem="indir" data-id="${id}">⬇️ İndir</button>`;
  if (v.youtube_id) b += `<a class="btn" target="_blank" href="https://youtube.com/shorts/${esc(v.youtube_id)}">📺 YouTube</a>`;
  if (grup !== "red") b += `<button data-islem="bilgi" data-id="${id}">✏️ Başlık / saat${v.durum === "bekliyor" ? " / konu" : ""}</button>`;
  if (["onay", "sirada", "zamanli"].includes(grup) && !v.hemen)
    b += `<button data-islem="hemen" data-id="${id}">🚀 Hemen yayınla</button>`;
  if (grup === "zamanli") b += `<button data-islem="sil" data-id="${id}">🗑️ YouTube'dan sil</button>`;
  if (!["yuklendi", "bekliyor", "seslendirildi"].includes(v.durum)) b += `
    <button data-islem="duzenle" data-id="${id}">🔁 Senaryo / yeniden üret</button>
    <button data-islem="kendi" data-id="${id}">📤 Kendi videomu yükle</button>`;
  const cumleler = (v.cumleler || []).map(c => `<p>${esc(c)}</p>`).join("");
  const duzeltme = (v.dogrulama_duzeltmeleri || []).length;
  return `<div class="kart" id="k_${id}">
    <div>${zamanYazi(v)} · <span class="alt">${v.tur === "trend" ? "📈 güncel" : v.tur === "ozel" ? "⚡ senin isteğin" : "🌿 evergreen"}${v.seri ? ` · 📺 ${esc(v.seri)}${v.seri_no ? " #" + esc(v.seri_no) : ""}` : ""}${v.hedef_sure ? ` · ⏱️ ${v.hedef_sure >= 60 ? (v.hedef_sure / 60).toString().replace(".", ",") + " dk" : v.hedef_sure + " sn"}` : ""}</span></div>
    <h3>${esc(v.baslik || v.konu)}</h3>
    <span class="rozet ${durumSinif}">${durumYazi}</span>
    ${v.youtube_guncelle ? `<span class="rozet">⏳ YouTube'a işleniyor</span>` : ""}
    ${bekleyenVar(v.id) ? `<span class="rozet hazir">⏳ isteğin sırada (birkaç dk)</span>` : ""}
    ${v.hemen_yayinla_istek ? `<span class="rozet">🚀 hemen yayına alınacak</span>` : ""}
    ${v.silinecek ? `<span class="rozet red">🗑️ YouTube'dan silinecek</span>` : ""}
    ${(v.kalite_hatasi || []).length ? `<span class="rozet red">🚫 kalite kontrolünden geçmedi</span><p class="ince">${esc(v.kalite_hatasi.join(" · "))} — ${v.durum === "reddedildi" ? "yayınlanmadı; 🔁 ile yeniden ürettirebilirsin." : "sıradaki çalışmada yeniden üretilecek."}</p>` : ""}
    ${(v.kalite_uyari || []).length ? `<p class="ince">🔎 Kalite notu: ${esc(v.kalite_uyari.join(" · "))}</p>` : ""}
    ${v.elle_duzenlendi ? `<span class="rozet">✏️ elle düzenlendi</span>` : ""}
    ${v.yorum_id || (YORUMLAR || {})[v.id] ? `<span class="rozet">💬 yorum atıldı</span>` : ""}
    ${v.baslik && v.konu !== v.baslik ? `<div class="alt" style="margin-top:6px">Konu: ${esc(v.konu)}</div>` : ""}
    ${v.talep != null ? `<div class="ince">📈 Talep: benzer Türkçe Shorts ortalama ${esc(Number(v.talep).toLocaleString("tr-TR"))} izlenme ("${esc(v.talep_arama || "")}")</div>` : ""}
    ${maliyetSatiri(v.id)}
    ${v.hook ? `<div class="alt">Ekran yazısı: <b>${esc(v.hook)}</b></div>` : ""}
    ${duzeltme ? `<div class="alt">🔎 ${duzeltme} bilgi düzeltmesi yapıldı</div>` : ""}
    ${cumleler ? `<details><summary>Senaryo</summary><blockquote>${cumleler}</blockquote>
      ${(v.hook_secenekleri || []).length ? `<div class="ince" style="margin-top:6px">Açılış seçenekleri:<br>${
        v.hook_secenekleri.map(h => (h === (v.cumleler || [])[0] ? "🏆 " : "• ") + esc(h)).join("<br>")}</div>` : ""}
    </details>` : ""}
    <div class="butonlar">${b}</div>
    <div id="oynat_${id}"></div>
    <div class="yukleme" id="yb_${id}"><i></i></div>
  </div>`;
}

// Video süresi seçenekleri (Shorts en fazla 3 dakika). 30 = normal kısa video.

function bilgiModal(v) {
  const grup = videoGrubu(v);
  const saatDegisir = grup !== "yayinda";
  modalAc(`
    <h3>✏️ Bilgileri düzenle</h3>
    <p class="alt">${zamanYazi(v)}</p>

function kararCubugu() {
  const onay = Object.values(KARARLAR).filter(k => k === "onay").length;
  const red = Object.values(KARARLAR).filter(k => k === "red").length;
  const c = $("#kararCubugu");
  c.style.display = (onay + red) ? "flex" : "none";
  $("#kararOzet").textContent = `👍 ${onay} onay · 👎 ${red} ret`;
}
$("#kararIptal").onclick = () => { KARARLAR = {}; kararCubugu(); if (SEKME === "videolar") videolar(); };
$("#kararGonder").onclick = async () => {
  $("#kararGonder").disabled = true;
  let onay = [], red = [];
  try {
    // Bekletilmiş eski kararlar artık onay beklemeyen (ör. yüklenmiş / yayında) videolara gitmesin
    const taze = await dosyaOku("haftalik_plan.json", []);
    const hazir = new Set(taze.filter(v => v.durum === "video_hazir").map(v => v.id));
    onay = Object.keys(KARARLAR).filter(k => KARARLAR[k] === "onay" && hazir.has(k));
    red = Object.keys(KARARLAR).filter(k => KARARLAR[k] === "red" && hazir.has(k));
    if (!onay.length && !red.length) { KARARLAR = {}; kararCubugu(); $("#kararGonder").disabled = false;
      return bildir("Bu videolar artık onay beklemiyor (durumları değişmiş). Liste yenileniyor.", 5000), videolar(); }
    await kuyrugaEkle("onay.json", {onayla: onay.join(","), reddet: red.join(",")},
                  `${onay.length} onay, ${red.length} ret`);
    KARARLAR = {}; kararCubugu();
    bildir("✅ Kararlar gönderildi. Onaylananlar birkaç dakika içinde YouTube'a yüklenmeye başlar.", 5000);
  } catch (e) { bildir("❌ " + e.message, 6000); }
  $("#kararGonder").disabled = false;
};

async function videoBlob(v) {
  const b = await assetBul(v);
  if (!b || !b.asset) throw new Error("Video dosyası bulunamadı.");
  const r = await fetch(b.asset.url, {headers: {Authorization: "Bearer " + TOKEN, Accept: "application/octet-stream"}});
  if (!r.ok) throw new Error("İndirilemedi (" + r.status + ")");
  return await r.blob();
}
function githubLinki(v) { return `https://github.com/${DEPO}/releases/download/${v.release}/${v.id}.mp4`; }

async function videoIslem(islem, id, buton) {
  const v = PLAN.find(x => x.id === id);
  if (islem === "onay" || islem === "red") {
    KARARLAR[id] = KARARLAR[id] === islem ? undefined : islem;
    if (!KARARLAR[id]) delete KARARLAR[id];
    document.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-islem="onay"], [data-id="${CSS.escape(id)}"][data-islem="red"]`).forEach(b =>
      b.className = KARARLAR[id] === b.dataset.islem ? (b.dataset.islem === "onay" ? "sec-onay" : "sec-red") : "");
    kararCubugu(); return;
  }
  if (islem === "izle" || islem === "indir") {
    const eski = buton.textContent; buton.disabled = true; buton.textContent = "⏳";
    try {
      const blob = await videoBlob(v); const url = URL.createObjectURL(blob);
      if (islem === "izle") $("#oynat_" + id).innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
      else { const a = document.createElement("a"); a.href = url; a.download = id + ".mp4"; a.click(); }
    } catch (e) {
      // Tarayıcı doğrudan indirmeye izin vermezse GitHub'da aç (GitHub'a giriş yapmış olman gerekir)
      bildir("Panelden açılamadı, GitHub'da açılıyor…"); window.open(githubLinki(v), "_blank");
    }
    buton.disabled = false; buton.textContent = eski; return;
  }
  if (islem === "hemen" || islem === "sil") {
    const soru = islem === "hemen"
      ? "Bu video yayın saatini beklemeden HEMEN yayınlansın mı?"
      : "Bu video YouTube'dan silinsin mi? (Henüz yayınlanmadı; geri alınamaz.)";
    if (!confirm(soru)) return;
    buton.disabled = true;
    try {
      await kuyrugaEkle("onay.json", islem === "hemen" ? {hemen: id} : {reddet: id},
                    islem === "hemen" ? `hemen yayınla ${id}` : `YouTube'dan sil ${id}`);
      bildir(islem === "hemen" ? "🚀 Gönderildi. 2-3 dakika içinde yayında." : "🗑️ Gönderildi. 2-3 dakika içinde silinir.", 5000);
    } catch (e) { bildir("❌ " + e.message, 6000); }
    buton.disabled = false; return;
  }
  if (islem === "duzenle") return duzenleModal(v);
  if (islem === "bilgi") return bilgiModal(v);
  if (islem === "kendi") return kendiVideom(v);
}

function kendiVideom(v) {
  modalAc(`
    <h3>📤 Kendi videonu yükle</h3>
    <p class="alt">Önce <b>⬇️ İndir</b> ile videoyu al, CapCut gibi bir uygulamada düzenle, sonra buradan yükle.
      YouTube'a <b>senin sürümün</b> gider (bu video henüz yüklenmediyse).</p>
    <div class="uyari">Dikey (9:16) MP4 olmalı. Bu video daha sonra "yeniden üret" yapılırsa senin sürümün silinir.</div>
    <label>Video dosyası</label><input type="file" id="kDosya" accept="video/mp4,video/*">
    <div class="yukleme" id="kIlerleme" style="display:block"><i></i></div>
    <div class="butonlar"><button onclick="modalKapat()">Vazgeç</button><button class="ana" id="kGonder">Yükle</button></div>`);
  $("#kGonder").onclick = async () => {
    const dosya = $("#kDosya").files[0];
    if (!dosya) return bildir("Önce bir video seç.");
    $("#kGonder").disabled = true;
    try {
      const b = await assetBul(v);
      if (!b) throw new Error("Bu haftanın Release'i bulunamadı.");
      const geciciAd = `${v.id}.yeni-${Date.now()}.mp4`;
      const yuklenen = await new Promise((tamam, hata) => {
        const x = new XMLHttpRequest();
        x.open("POST", `https://uploads.github.com/repos/${DEPO}/releases/${b.rel.id}/assets?name=${encodeURIComponent(geciciAd)}`);
        x.setRequestHeader("Authorization", "Bearer " + TOKEN);
        x.setRequestHeader("Content-Type", dosya.type || "video/mp4");
        x.upload.onprogress = e => { if (e.lengthComputable) $("#kIlerleme i").style.width = (100 * e.loaded / e.total) + "%"; };
        x.onload = () => x.status < 300 ? tamam(JSON.parse(x.responseText)) : hata(new Error("Yükleme hatası " + x.status + ": " + x.responseText.slice(0, 150)));
        x.onerror = () => hata(new Error("Ağ hatası (tarayıcı yüklemeyi engellemiş olabilir)."));
        x.send(dosya);
      });
      // Yükleme başarılı → eskisini sil, yenisini asıl adına çevir (yarıda kalırsa eski video kaybolmaz)
      if (b.asset) await gh(`/repos/${DEPO}/releases/assets/${b.asset.id}`, {method: "DELETE"});
      await gh(`/repos/${DEPO}/releases/assets/${yuklenen.id}`, {method: "PATCH", body: JSON.stringify({name: `${v.id}.mp4`})});
      delete RELEASES[v.release];
      modalKapat(); bildir("✅ Senin videon yüklendi. YouTube'a bu sürüm gidecek.", 5000);
    } catch (e) { bildir("❌ " + e.message, 7000); $("#kGonder").disabled = false; }
  };
}

      catch (e) { bildir("❌ " + e.message, 6000); b.disabled = false; }
    });
    document.querySelectorAll("[data-kaldir]").forEach(b => b.onclick = async () => {
      if (!confirm("Bu anahtar panelden kaldırılsın mı? (Varsa GitHub secret'ı kullanılır.)")) return;
      try { await kasadanSil(b.dataset.kaldir); bildir("Kaldırıldı."); anahtarCiz(); } catch (e) { bildir("❌ " + e.message, 6000); }
    });
  };
  anahtarCiz();
  // 🧪 Test: anahtar_testi.json (Anahtar Testi işi yazar) gösterilir
  const testGoster = async (bekleyen) => {
    const t = await dosyaOku("anahtar_testi.json", null);
    if (!t || !t.sonuclar) { $("#testSonuc").innerHTML = `<p class="ince">Henüz test yapılmadı.</p>`; return t; }
    $("#testSonuc").innerHTML = `<div class="ince">Son test: <b>${esc(t.zaman)}</b>${bekleyen ? " · ⏳ yeni test sürüyor…" : ""}</div>` +
      t.sonuclar.map(x => `<div style="margin:4px 0">${x.ok ? "✅" : "❌"} <b>${esc(x.ad)}</b><div class="ince">${esc(x.mesaj)}</div></div>`).join("");
    return t;
  };
  testGoster();
  $("#aiTest").onclick = async () => {
    const b = $("#aiTest"); b.disabled = true;
    try {
      const once = await dosyaOku("anahtar_testi.json", null);
      await tetikle("anahtar.json", {}, "yapay zekâ testi");
      bildir("🧪 Test başladı, 1-2 dakika içinde sonuç burada çıkar.", 5000);
      for (let i = 0; i < 24; i++) {          // en fazla ~4 dk bekle
        await new Promise(r => setTimeout(r, 10000));
        if (!document.body.contains(b)) return;  // sayfa değişti
        const t = await testGoster(true);
        if (t && (!once || t.zaman !== once.zaman)) { await testGoster(false); bildir("🧪 Test bitti.", 4000); break; }
      }
    } catch (e) { bildir("❌ " + e.message, 6000); }
    b.disabled = false;
  };
  saglayiciCiz(a.EK_SAGLAYICILAR || []);
  gorevCiz(a.EK_SAGLAYICILAR || []);
  ["#profil", "#ritim"].forEach(id => $(id) && $(id).addEventListener("change", () => gorevCiz(saglayicilariOku())));
  $("#saatEkle").onclick = () => { const l = [...document.querySelectorAll(".saat")].map(x => x.value); if (l.length < 6) { l.push("18:00"); saatCiz(l); } };
  $("#karartma").oninput = e => $("#kVal").textContent = e.target.value + "%";
  $("#muzikSes").oninput = e => $("#mVal").textContent = e.target.value + "%";
  $("#ayarKaydet").onclick = async () => {
    const saatler = [...document.querySelectorAll(".saat")].map(x => x.value).filter(Boolean).sort();
    if (!saatler.length) return bildir("En az bir yayın saati olmalı.");
    const yeni = {
      YAYINLANMA_SAATLERI: saatler,
      TREND_GUNLERI: [...document.querySelectorAll("[data-gun]")].filter(x => x.checked).map(x => +x.dataset.gun),
      GUNLUK_YUKLEME_LIMITI: Math.min(6, Math.max(1, +$("#limit").value || 6)),
      YUKLEME_ONCEDEN_SAAT: +$("#onceden").value, URETIM_RITMI: $("#ritim").value,
      KATEGORILER: $("#kategoriler").value.split("\n").map(x => x.trim()).filter(Boolean),
      KONU_NOTU: $("#konuNotu").value.trim(), TALEP_KONTROLU: $("#talep").checked, SENARYO_NOTU: $("#senaryoNotu").value.trim(), GORSEL_NOTU: $("#gorselNotu").value.trim(), CLOUDFLARE_HESAP: $("#cfHesap").value.trim(), UYGUNLUK_KONTROLU: $("#uygunluk").value,
      OZEL_KONULAR: $("#ozelKonular").value.split("\n").map(x => x.trim()).filter(Boolean),
      MALIYET_PROFILI: $("#profil").value, BILGI_DOGRULAMA: ($("[data-gorev='dogrulama']") || {}).value !== "kapali", OTOMATIK_ONAY: $("#otoOnay").checked,
      ONAY_MODU: $("#onayModu").value,
      TTS_SES: $("#ses").value, TTS_HIZ: $("#hiz").value,
      SES_MOTORU: $("#motor").value, ELEVENLABS_SES: $("#elSes").value.trim() || VARSAYILAN_AYARLAR.ELEVENLABS_SES, KARARTMA: +$("#karartma").value / 100,
      VIDEO_KLIP_ONCELIKLI: true,
      ALTYAZI_BOYUT: +$("#aBoyut").value, ALTYAZI_KELIME: +$("#aKelime").value,
      HOOK_BOYUT: +$("#hBoyut").value, HOOK_SURE: +$("#hSure").value,
      GORSEL_CESITLILIK: $("#cesit").checked, SERI_ETIKETI: $("#seriEt").checked, FON_MUZIGI: $("#muzik").checked,
      MUZIK_SESI: +$("#muzikSes").value / 100, OTOMATIK_YORUM: $("#yorum").checked,
      IZIN_SURESIZ: $("#suresiz").checked, ELEVENLABS_BITIS: $("#elBitis").value || "",
      EK_SAGLAYICILAR: saglayicilariOku(),
      SES_EK_MODEL: $("#sesEkModel").value, SES_EK_SES: $("#sesEkSes").value.trim() || "alloy", SES_EK_FIYAT: +$("#sesEkFiyat").value || 0,
      GORSEL_KAYNAKLARI: kaynakDurum.filter(x => x.acik).map(x => x.k),
      OZEL_KAYNAKLAR: kaynakDurum.some(x => x.acik && x.k === "nasa_wiki"),
      GORSEL_EK_MODEL: ((kaynakDurum.find(x => x.acik && x.k.startsWith("ai:")) || {}).k || "").replace(/^ai:/, ""),
      GORSEL_EK_BOYUT: $("#gorselEkBoyut").value.trim() || "1024x1536", GORSEL_EK_FIYAT: +$("#gorselEkFiyat").value || 0,
      GOREV_MODELLERI: Object.fromEntries([...document.querySelectorAll("[data-gorev]")].map(x => [x.dataset.gorev, x.value]).filter(([, v]) => v)),
    };
    const sinirla = (x, alt, ust, vars) => Number.isFinite(x) && x >= alt && x <= ust ? x : vars;
    yeni.ALTYAZI_BOYUT = sinirla(yeni.ALTYAZI_BOYUT, 60, 140, VARSAYILAN_AYARLAR.ALTYAZI_BOYUT);
    yeni.ALTYAZI_KELIME = sinirla(yeni.ALTYAZI_KELIME, 1, 5, VARSAYILAN_AYARLAR.ALTYAZI_KELIME);
    yeni.HOOK_BOYUT = sinirla(yeni.HOOK_BOYUT, 60, 150, VARSAYILAN_AYARLAR.HOOK_BOYUT);
    yeni.HOOK_SURE = sinirla(yeni.HOOK_SURE, 1, 6, VARSAYILAN_AYARLAR.HOOK_SURE);
    if (!yeni.KATEGORILER.length) return bildir("En az bir kategori olmalı.");
    if (!yeni.GORSEL_KAYNAKLARI.length) return bildir("🖼️ Görüntüler kartında en az bir kaynağı işaretle.");
    if (yeni.CLOUDFLARE_HESAP && !/^[0-9a-zA-Z]{16,64}$/.test(yeni.CLOUDFLARE_HESAP)) return bildir("Cloudflare hesap numarası sadece harf ve rakamdan oluşmalı (32 hane).", 5000);
    if (yeni.GORSEL_KAYNAKLARI.some(k => k.startsWith("ai:cloudflare:")) && !yeni.CLOUDFLARE_HESAP)
      return bildir("Cloudflare için hesap numarasını (Account ID) gir.", 5000);
    if (yeni.SES_MOTORU === "ek" && !yeni.SES_EK_MODEL) return bildir("Ek sağlayıcı sesi için model seç.", 5000);
    $("#ayarKaydet").disabled = true;
    try {
      // Sayfa açıkken bot da ayarlar.json'u değiştirmiş olabilir (ör. kullanılan istek konuları silindi).
      // Taze dosyayı al, sadece BU SAYFADA değiştirdiğin alanları üzerine yaz.
      const taze = await dosyaOku("ayarlar.json", {});
      const sonuc = {...(typeof taze === "object" && taze ? taze : {})};
      let degisen = 0;
      for (const [k, deger] of Object.entries(yeni)) {
        if (JSON.stringify(deger) !== JSON.stringify(a[k])) { sonuc[k] = deger; degisen++; }
        else if (!(k in sonuc)) sonuc[k] = deger;
      }
      if (!degisen) { bildir("Değişiklik yok."); $("#ayarKaydet").disabled = false; return; }
      await dosyaYaz("ayarlar.json", sonuc, "Panel: ayarlar güncellendi");
      Object.assign(a, yeni);
      bildir(`✅ Ayarlar kaydedildi (${degisen} değişiklik).`);
    }
    catch (e) { bildir("❌ " + e.message, 6000); }
    $("#ayarKaydet").disabled = false;
  };
}

// ─────────────────────────────────────────
//  İSTATİSTİK + MALİYET
// ─────────────────────────────────────────
async function istatistik() {
  $("#ana").innerHTML = `<p class="alt">Yükleniyor…</p>`;
  const [perf, maliyet, st] = await Promise.all([dosyaOku("performans.json", null), dosyaOku("maliyet.json", []),
                                                 dosyaOku("strateji.json", null)]);
  const simdi = Date.now(), gun = 864e5;
  const toplam = g => (maliyet || []).filter(k => simdi - new Date(k.zaman) < g * gun).reduce((s, k) => s + k.usd, 0);
  const isler = {};
  (maliyet || []).filter(k => simdi - new Date(k.zaman) < 30 * gun).forEach(k => isler[k.is] = (isler[k.is] || 0) + k.usd);
  const enBuyukIs = Math.max(0.0001, ...Object.values(isler));
  let html = `<div class="kart"><h3>💰 Yapay zekâ maliyeti (tahmini)</h3>
    <div class="satir"><div><div class="alt">Son 7 gün</div><b style="font-size:22px">${toplam(7).toFixed(2)} $</b></div>
    <div><div class="alt">Son 30 gün</div><b style="font-size:22px">${toplam(30).toFixed(2)} $</b></div></div>
    ${Object.entries(isler).sort((a, b) => b[1] - a[1]).map(([is, usd]) => `
      <div style="margin-top:10px"><div class="satir"><span>${esc(is)}</span><span style="text-align:right">${usd.toFixed(3)} $</span></div>
      <div class="cubuk"><i style="width:${100 * usd / enBuyukIs}%"></i></div></div>`).join("")}
    ${(() => {
      const son = (maliyet || []).filter(k => k.video && simdi - new Date(k.zaman) < 30 * gun);
      const vids = new Set(son.map(k => k.video));
      if (!vids.size) return "";
      const usd = son.reduce((t, k) => t + (k.usd || 0), 0), kredi = son.reduce((t, k) => t + (k.kredi || 0), 0);
      return `<div class="satir" style="margin-top:10px"><div><div class="alt">Video başına ortalama</div><b>${(usd / vids.size).toFixed(3)} $</b></div>
        <div><div class="alt">ElevenLabs / video</div><b>${Math.round(kredi / vids.size)} kredi</b></div></div>
        <p class="ince">Konu bulma ve haftalık analiz gibi ortak işler video başına sayılmaz (haftada ~0,05-0,10 $).</p>`;
    })()}
    <p class="ince">Gerçek fatura: Anthropic Console → Usage.</p></div>`;
  if (perf && perf.analytics && perf.analytics !== "var") {
    const neden = {
      api_kapali: `Google Cloud projesinde <b>YouTube Analytics API</b> açık değil. <a href="https://console.cloud.google.com/apis/library/youtubeanalytics.googleapis.com" target="_blank">Bu sayfayı aç</a> → doğru projeyi seç → <b>Enable / Etkinleştir</b>. Bir kere yapman yeter.`,
      izin_yok: `YouTube izninde istatistik yetkisi yok. <b>YouTube izni</b> sekmesinden izni bir kez yenile.`,
    }[perf.analytics] || `Sebep: ${esc(perf.analytics_hata || "bilinmiyor (sıradaki üretimde belli olacak)")}`;
    html += `<div class="kart"><h3>⚠️ "Videonun yüzde kaçı izlendi" verisi gelmiyor</h3>
      <p class="alt">Bu veri olmadan sistem hangi açılışın izleyiciyi tuttuğunu öğrenemez.</p><p>${neden}</p></div>`;
  }
  const liste = l => (l || []).map(x => `<li>${esc(x)}</li>`).join("");
  html += st && st.ozet ? `<div class="kart"><h3>🧠 Sistemin öğrendikleri</h3>
      <p class="ince">${esc(st.tarih)} · ${esc(st.video_sayisi)} video analiz edildi · her Perşembe yenilenir</p>
      <p>${esc(st.ozet)}</p>
      ${st.tutanlar && st.tutanlar.length ? `<b>✅ Tutanlar</b><ul class="alt">${liste(st.tutanlar)}</ul>` : ""}
      ${st.tutmayanlar && st.tutmayanlar.length ? `<b>❌ Tutmayanlar</b><ul class="alt">${liste(st.tutmayanlar)}</ul>` : ""}
      <b>📺 Seri öncelikleri</b>${Object.entries(st.seri_agirliklari || {}).sort((a, b) => b[1] - a[1]).map(([ad, a]) => `
        <div style="margin-top:6px"><div class="satir"><span>${esc(ad)}</span><span style="text-align:right">${a.toFixed(1)}×</span></div>
        <div class="cubuk"><i style="width:${50 * a}%"></i></div></div>`).join("")}
      ${st.deneme ? `<p class="alt">🧪 Bu hafta denenecek: ${esc(st.deneme)}</p>` : ""}
      ${(st.gecmis || []).length > 1 ? `<details><summary class="alt">Önceki haftalar</summary><ul class="alt">${(st.gecmis || []).slice(0, -1).reverse().map(h => `<li><b>${esc(h.tarih)}</b>: ${esc(h.ozet)}</li>`).join("")}</ul></details>` : ""}
    </div>` : `<div class="kart"><h3>🧠 Sistemin öğrendikleri</h3><p class="alt">İlk analiz yeterli veri birikince (en az 6 video) Perşembe üretiminde yapılır.</p></div>`;
  if (perf && (perf.videolar || []).length) {
    const enCok = Math.max(1, ...perf.videolar.map(v => v.izlenme));
    html += `<div class="kart"><h3>📊 Kanal performansı</h3><p class="ince">Son güncelleme: ${esc(perf.tarih)} · ${perf.videolar.length} video</p>
      ${perf.videolar.map(v => `<div style="margin-top:10px">
        <div class="satir"><span style="flex:3">${esc(v.baslik)}</span><span style="text-align:right">${esc(v.izlenme)} 👁 ${esc(v.begeni)} 👍${v.izlenme_yuzdesi != null ? ` · %${esc(v.izlenme_yuzdesi)}` : ""}</span></div>
        <div class="cubuk"><i style="width:${100 * v.izlenme / enCok}%"></i></div></div>`).join("")}</div>`;
  } else html += `<div class="kart"><h3>📊 Kanal performansı</h3><p class="alt">Veri her Perşembe üretimde toplanır.</p></div>`;
  $("#ana").innerHTML = html;
}

// ─────────────────────────────────────────
//  YOUTUBE İZNİ
// ─────────────────────────────────────────
async function izin() {
  $("#ana").innerHTML = `<p class="alt">Yükleniyor…</p>`;
  const [gizli, izinTarihi] = await Promise.all([
    dosyaOku("client_secrets.json", null),
    dosyaOku("izin_tarihi.json", null),
  ]);
  const c = gizli && (gizli.installed || gizli.web);
  const ayarSuresiz = (await dosyaOku("ayarlar.json", {}) || {}).IZIN_SURESIZ;
  let durum = "⚠️ İznin alındığı tarih bilinmiyor.";
  if (izinTarihi && izinTarihi.tarih) {
    const yas = Math.floor((Date.now() - new Date(izinTarihi.tarih)) / 864e5);
    const kalan = 7 - yas;
    durum = `${kalan <= 1 ? "🔴" : kalan <= 2 ? "🟡" : "🟢"} ${yas} gün önce yenilendi — yaklaşık <b>${Math.max(kalan, 0)} gün</b> kaldı.`;
  }
  if (ayarSuresiz) durum = `♾️ Google uygulaması yayında: izin <b>süresiz</b>, yenilemen gerekmez. (Son yenileme: ${izinTarihi && izinTarihi.tarih ? esc(new Date(izinTarihi.tarih).toLocaleDateString("tr-TR")) : "?"})
    <br><span class="alt">Sadece bir hata olursa (ör. Google izni geri alırsa) aşağıdan yeniden izin ver.</span>`;
  const link = c ? c.auth_uri + "?" + new URLSearchParams({client_id: c.client_id, redirect_uri: "http://localhost:8080/",
    response_type: "code", scope: SCOPES.join(" "), access_type: "offline", prompt: "consent"}) : "";
  $("#ana").innerHTML = `<div class="kart"><h3>🔑 YouTube izni</h3><p>${durum}</p>
    <p class="alt">${ayarSuresiz ? "Gerekirse yeniden izin vermek için:" : 'Google "Testing" modunda izin 7 günde biter. Bitmeden yenile:'}</p>
    <ol class="alt"><li>Aşağıdaki düğmeye bas, <b>kanalın Gmail'iyle</b> izin ver (Tümünü seç → Devam).</li>
      <li>"Bu siteye ulaşılamıyor" sayfası açılınca <b>adres çubuğundaki adresi</b> kopyala.</li>
      <li>Buraya yapıştırıp <b>Gönder</b>'e bas. (Kod birkaç dakikada bozulur, hemen yap.)</li></ol>
    ${link ? `<a class="btn" style="background:var(--vurgu);color:#111;border-color:var(--vurgu)" target="_blank" href="${esc(link)}">🔑 Google'da izin ver</a>` : `<div class="hata">client_secrets.json okunamadı.</div>`}
    <label>Dönen adres</label><textarea id="donus" style="min-height:80px" placeholder="http://localhost:8080/?code=..."></textarea>
    <div class="butonlar"><button class="ana" id="izinGonder">Gönder</button></div></div>`;
  $("#izinGonder").onclick = async () => {
    const d = $("#donus").value.trim();
    if (!/code(=|%3D)/.test(d)) return bildir("Adreste 'code=' yok. Tam adresi kopyaladığından emin ol.", 5000);
    $("#izinGonder").disabled = true;
    try { await tetikle("yetki.json", {donus_adresi: d}, "YouTube izni yenile"); bildir("✅ Gönderildi. 1 dakika sonra 'İşler'den kontrol et.", 5000); }
    catch (e) { bildir("❌ " + e.message, 6000); }
    $("#izinGonder").disabled = false;
  };
}

// ─────────────────────────────────────────
//  İŞLER (GitHub Actions çalıştırmaları)
// ─────────────────────────────────────────
async function isler() {
  const r = await gh(`/repos/${DEPO}/actions/runs?per_page=12`);
  if (r.status === 404) { $("#ana").innerHTML = `<div class="hata">İşler okunamadı (token'a Actions: Read izni ver).</div>`; return; }
  const veri = await r.json();
  const simge = x => x.status !== "completed" ? "⏳" : ({success: "✅", failure: "❌", cancelled: "⏹️", skipped: "➖"}[x.conclusion] || "•");
  $("#ana").innerHTML = `<div class="butonlar" style="margin:0 0 12px"><button id="islerYenile">↻ Yenile</button>
      <button id="anahtarTesti">🔑 Anahtar testi</button></div>` +
    (veri.workflow_runs || []).map(x => `<div class="kart">
      <div>${simge(x)} <b>${esc(x.name)}</b></div>
      <div class="alt">${new Date(x.created_at).toLocaleString("tr-TR")} · ${esc(String(x.display_title || "").slice(0, 80))}</div>
      <a class="ince" target="_blank" href="${esc(x.html_url)}">Ayrıntı</a></div>`).join("");
  $("#islerYenile").onclick = isler;
  $("#anahtarTesti").onclick = async () => {
    try { await tetikle("anahtar.json", {}, "anahtar testi");
          bildir("🔑 Test başladı. 1-2 dakika sonra ↻ → 'Anahtar Testi' → Ayrıntı.", 5000); }
    catch (e) { bildir("❌ " + e.message, 6000); }
  };
}

// ─────────────────────────────────────────
//  BAŞLAT
// ─────────────────────────────────────────
const SAYFALAR = {videolar, ayarlar, istatistik, izin, isler};
async function sekmeAc(s) {
  SEKME = s;
  document.querySelectorAll("#sekmeler button").forEach(b => b.classList.toggle("aktif", b.dataset.s === s));
  try { await SAYFALAR[s](); }
  catch (e) {
    $("#ana").innerHTML = `<div class="hata">${esc(e.message)}</div>
      <div class="butonlar"><button onclick="localStorage.removeItem('ytb_token');location.reload()">Token'ı değiştir</button></div>`;
  }
}
document.querySelectorAll("#sekmeler button").forEach(b => b.onclick = () => sekmeAc(b.dataset.s));
async function izinSeridi() {
  try {
    const [ayar, it] = await Promise.all([dosyaOku("ayarlar.json", {}), dosyaOku("izin_tarihi.json", null)]);
    const s = $("#izinSerit");
    if ((ayar && ayar.IZIN_SURESIZ) || !it || !it.tarih) { s.style.display = "none"; return; }
    const kalan = 7 - (Date.now() - new Date(it.tarih)) / 864e5;
    const bitis = new Date(new Date(it.tarih).getTime() + 7 * 864e5);
    const tarih = bitis.toLocaleDateString("tr-TR", {weekday: "long", day: "numeric", month: "long"});
    const [renk, ikon, metin] = kalan <= 1 ? ["#5a1d1d", "🔴", "HEMEN yenile"] : kalan <= 2 ? ["#5a4a1d", "🟡", "yakında yenile"] : ["#1d3a2a", "🟢", "sorun yok"];
    s.style.background = renk;
    s.innerHTML = kalan <= 0 ? `🔴 <b>YouTube izni bitti!</b> Videolar yüklenemiyor — dokun ve yenile.`
      : `${ikon} YouTube izni: <b>${Math.max(0, Math.floor(kalan))} gün ${Math.floor((kalan % 1) * 24)} saat</b> kaldı (${tarih}) · ${metin}`;
    s.style.display = "";
    s.onclick = () => sekmeAc("izin");
  } catch (e) {}
}
async function basla() {
  if (!TOKEN) return kurulumEkrani();
  $("#sekmeler").style.display = "";
  izinSeridi(); setInterval(izinSeridi, 10 * 60 * 1000);
  try { const u = await (await gh("/user")).json(); $("#kullanici").textContent = u.login || ""; } catch (e) {}
  sekmeAc("videolar");
}
basla();
</script>
